<style>

lay:block}.step-title{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:20px}.step-title h2{margin:0;font-size:1.25rem}.step-title p{margin:6px 0 0;color:var(--muted);font-size:.8rem}.badge{padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.68rem}.group{margin-top:20px}.group h3{margin:0 0 10px;font-size:.9rem}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}.choice{min-height:62px;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);text-align:left;font-weight:750;transition:.15s ease}.choice:hover{transform:translateY(-2px);background:rgba(255,255,255,.065)}.choice.selected{border-color:rgba(118,239,204,.6);background:rgba(118,239,204,.11);box-shadow:0 0 0 3px rgba(118,239,204,.07)}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.primary,.ghost{min-height:46px;padding:0 18px;border-radius:14px;border:0;font-weight:850}.primary{color:#06101d;background:linear-gradient(135deg,var(--blue),var(--mint))}.ghost{color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line)}.primary:disabled{opacity:.35;cursor:not-allowed}.question-wrap{min-height:460px;display:grid;place-items:center;text-align:center;padding:28px}.question-card{width:min(760px,100%)}.progress-line{height:5px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:30px}.progress-line span{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--blue),var(--mint));transition:.3s ease}.question-kicker{color:var(--muted);font-size:.75rem;letter-spacing:.11em;text-transform:uppercase}.question{font-size:clamp(1.65rem,4vw,3.15rem);line-height:1.32;letter-spacing:-.04em;margin:14px auto 25px;max-width:760px}.answer-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answer{min-width:150px;min-height:58px;border-radius:18px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.045);font-weight:850;font-size:1rem}.answer:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}.question-meta{display:flex;justify-content:center;gap:14px;margin-top:18px;color:var(--muted);font-size:.72rem}.result-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.result-main,.result-side{padding:22px;border-radius:22px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.result-label{color:var(--mint);font-size:.72rem;font-weight:850;letter-spacing:.13em}.result-main h2{font-size:clamp(1.8rem,4vw,3.3rem);margin:8px 0 12px;letter-spacing:-.05em}.result-main>p{color:#d7e1ef;line-height:1.8}.action-list{display:grid;gap:10px;margin-top:20px}.action-item{display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:start;padding:13px;border-radius:16px;background:rgba(255,255,255,.045)}.action-item b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#07131f;background:linear-gradient(145deg,var(--blue),var(--mint))}.action-item strong{display:block;margin-bottom:4px}.action-item span{color:var(--muted);font-size:.8rem;line-height:1.55}.side-block{margin-bottom:18px}.side-block h3{font-size:.83rem;margin:0 0 9px;color:var(--muted)}.tag-wrap{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:999px;background:rgba(116,169,255,.11);color:#cfe1ff;font-size:.72rem}.warning{padding:13px 14px;border-radius:15px;background:rgba(255,179,108,.09);border-left:4px solid var(--orange);line-height:1.6;font-size:.8rem}.score-list{display:grid;gap:8px}.score-row{display:grid;grid-template-columns:110px 1fr 32px;gap:8px;align-items:center;font-size:.72rem;color:var(--muted)}.score-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.score-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue))}.history{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem}@media(max-width:760px){.hero{display:block}.hero p{text-align:left}.result-layout{grid-template-columns:1fr}.question-wrap{padding:18px 8px}.answer{min-width:120px;flex:1}.home span{display:none}.shell{padding-top:74px}}

.result-insights{display:grid;gap:12px;margin-top:18px}
.insight-card{padding:15px 16px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.insight-card h3{margin:0 0 7px;font-size:.86rem}
.insight-card p{margin:0;color:#c8d5e6;font-size:.8rem;line-height:1.7}
.insight-card.danger{border-left:4px solid var(--pink);background:rgba(255,142,176,.07)}
.insight-card.growth{border-left:4px solid var(--mint);background:rgba(118,239,204,.06)}
.insight-card.later{border-left:4px solid var(--violet);background:rgba(182,147,255,.06)}

.language-box span{display:block;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.1em;margin-bottom:7px}
.language-box strong{font-size:1rem;line-height:1.65}
.secondary-actions{display:grid;gap:8px;margin-top:12px}
.secondary-action{padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.035);font-size:.78rem;line-height:1.6}

</style></head>
<body><a class="home" href="index.html"><i></i><span>HOME</span></a><main class="shell"><header class="hero"><div><div class="eyebrow">Adaptive problem solving</div><h1>Decision Lab</h1></div><p>問題文を読まずに、状況と答え方から「次に何をするか」を組み立てる。質問は一問ずつ、必要なものだけ。</p></header><section class="panel">
<div id="setupScreen" class="screen active inner"><div class="step-title"><div><h2>最初に、問題の地形だけ教えて</h2><p>文章は使わない。選択肢だけで質問の入口を決めます。</p></div><span class="badge">STEP 1</span></div><div id="setupGroups"></div><div class="footer-actions"><button id="startBtn" class="primary" disabled>診断をはじめる</button></div></div>
<div id="questionScreen" class="screen"><div class="question-wrap"><div class="question-card"><div class="progress-line"><span id="progressBar"></span></div><div id="questionKicker" class="question-kicker"></div><div id="questionText" class="question"></div><div class="answer-row"><button class="answer" data-answer="yes">YES</button><button class="answer" data-answer="no">NO</button><button class="answer" data-answer="unknown">わからない</button><button class="answer" data-answer="na">該当しない</button></div><div class="question-meta"><span id="questionCount"></span><span id="branchHint"></span></div></div></div></div>
<div id="resultScreen" class="screen inner"><div class="step-title"><div><h2>いまの仮結論</h2><p>必要なら、追加質問で精度を上げられます。</p></div><span class="badge">RESULT</span></div><div id="resultContent"></div><div class="footer-actions"><button id="moreBtn" class="ghost">もう少し絞る</button><button id="restartBtn" class="primary">最初から</button></div></div>
</section></main>
<script>
const setupConfig=[
{id:'time',title:'いつまでに動く？',multi:false,options:[['today','今日〜3日'],['week','1週間くらい'],['month','1か月くらい'],['long','数か月以上'],['unknown','まだ分からない']]},
{id:'people',title:'誰が関わる？',multi:false,options:[['self','自分だけ'],['one','特定の相手1人'],['group','少人数'],['org','学校・会社・組織'],['public','不特定多数']]},
{id:'domains',title:'何が絡む？',multi:true,options:[['money','お金'],['time','時間'],['relation','人間関係'],['study','学業・能力'],['career','仕事・進路'],['health','健康・体力'],['emotion','感情'],['creative','創作'],['system','ルール・制度'],['risk','安全・リスク']]},
{id:'stage',title:'どこで止まってる？',multi:true,max:2,options:[['unclear','問題がぼんやり'],['cause','原因が分からない'],['info','情報不足'],['ideas','案がない'],['choice','選べない'],['agreement','合意できない'],['action','動けない'],['stuck','動いても進まない'],['repeat','繰り返している'],['emotion','感情が強い']]},
{id:'control',title:'自分で動かせる範囲は？',multi:false,options:[['high','ほぼ自分で動かせる'],['medium','相手の協力が少し必要'],['joint','合意が必要'],['authority','許可が必要'],['low','環境次第'],['unknown','分からない']]},
{id:'reversibility',title:'失敗したら戻せる？',multi:false,options:[['easy','すぐ戻せる'],['some','少し損するが戻せる'],['hard','かなり損する'],['irreversible','ほぼ戻せない'],['unknown','分からない']]},
{id:'mindset',title:'今の気分は？',multi:true,max:2,options:[['fast','早く決めたい'],['careful','慎重に進めたい'],['confirm','考えを確認したい'],['fear','失敗が怖い'],['avoid','避けている'],['logic','合理的に考えたい'],['values','納得感もほしい']]}
];
const vars=['clarity','information','options','decision','action','friction','fear','reversibility','urgency','conflict','trust','coordination','boundary','incentive','control','system','habit','energy','emotion','money','time','risk','learning','creative','stakeholder','feedback','experiment','uncertainty','repeat','alignment','communication','evidence','priority','scope','dependency','permission','tradeoff','overthinking','avoidance','rigidity','shortterm','ownership','measurement','sequencing','maintenance','socialguess','resourcegap','followthrough','adaptability','selfinterest','fairness'];
const labels={clarity:'問題の輪郭',information:'情報不足',options:'選択肢',decision:'意思決定',action:'行動',friction:'摩擦',fear:'不安',reversibility:'戻しやすさ',urgency:'緊急度',conflict:'利害衝突',trust:'信頼',coordination:'調整',boundary:'境界線',incentive:'動機設計',control:'制御可能性',system:'構造',habit:'習慣',energy:'実行エネルギー',emotion:'感情負荷',money:'金銭',time:'時間',risk:'リスク',learning:'学習',creative:'発想',stakeholder:'関係者',feedback:'検証',experiment:'小さな実験',uncertainty:'不確実性',repeat:'再発',alignment:'方向一致',communication:'伝え方',evidence:'根拠',priority:'優先順位',scope:'問題範囲',dependency:'依存関係',permission:'許可',tradeoff:'トレードオフ',overthinking:'考えすぎ',avoidance:'回避傾向',rigidity:'固定化',shortterm:'短期偏重',ownership:'当事者意識',measurement:'測定',sequencing:'順序設計',maintenance:'維持設計',socialguess:'相手の推測',resourcegap:'資源不足',followthrough:'継続力',adaptability:'修正力',selfinterest:'自分の利害',fairness:'公平感'};
const Q=[];let qn=0;const add=(group,text,kicker,w,domain=null)=>Q.push({id:'q'+(++qn),group,text,kicker,w,domain});
const bank={
clarity:[['解決したい状態は、頭の中ではっきりしてる？',{yes:{clarity:-2,action:1},no:{clarity:3,scope:2},unknown:{clarity:2}}],['問題を小さく一つに切れそう？',{yes:{scope:-2,action:1},no:{scope:3,clarity:1}}],['本当は別の問題が奥にある感じがする？',{yes:{clarity:3},no:{clarity:-1}}]],
information:[['決めるために足りない事実がある？',{yes:{information:3,evidence:2},no:{information:-2,decision:1}}],['誰かに一度聞けば分かることが残ってる？',{yes:{information:2,communication:1},no:{information:-1}}],['推測を事実として扱ってる部分がある？',{yes:{evidence:3,information:2},no:{evidence:-1}}]],
options:[['選択肢が二つしかないように見えてる？',{yes:{options:3,creative:2},no:{options:-1}}],['両方を少しずつ試す形にできる？',{yes:{experiment:3},no:{tradeoff:2}}],['逆のやり方を考えたことがある？',{yes:{creative:-1},no:{creative:2,options:1}}]],
decision:[['選ぶ基準はもう決まってる？',{yes:{decision:-2,action:2},no:{decision:3,priority:2}}],['一番避けたい失敗ははっきりしてる？',{yes:{risk:-1},no:{risk:2,decision:2}}],['決定を先延ばしにするコストがある？',{yes:{urgency:2,action:1},no:{urgency:-1}}]],
action:[['やること自体は、もう分かってる？',{yes:{action:2,clarity:-2},no:{clarity:2,options:1}}],['最初の15分でやることを言える？',{yes:{action:-1},no:{action:3,scope:1}}],['始めるための準備が足りない？',{yes:{friction:2,dependency:1},no:{friction:-1}}],['失敗より、始める瞬間が重い？',{yes:{friction:3},no:{fear:1}}]],
relation:[['相手との関係が悪くなるのが気になる？',{yes:{fear:2,communication:2},no:{fear:-1}}],['相手と目指しているものは同じ？',{yes:{alignment:-2,coordination:2},no:{alignment:3,conflict:2}}],['相手の得たいものを説明できる？',{yes:{stakeholder:-1},no:{stakeholder:3,information:1}}],['直接言わずに動かせる余地がある？',{yes:{experiment:2,communication:1},no:{communication:2,boundary:1}}],['約束より、仕組みを変えた方が効きそう？',{yes:{system:2,incentive:2},no:{communication:1}}],['今必要なのは説得より、線引き？',{yes:{boundary:3},no:{coordination:1}}]],
money:[['金額より、今後の余裕が読めないのが問題？',{yes:{uncertainty:2,money:2},no:{money:1}}],['失っても生活や予定に影響しない額？',{yes:{risk:-2},no:{risk:3,money:2}}],['将来の支出予定まで含めて考えた？',{yes:{money:-1},no:{money:3,dependency:1}}]],
time:[['期限は自分で決められる？',{yes:{control:1,urgency:-1},no:{urgency:2,dependency:1}}],['重要だけど急がないことが押し出されてる？',{yes:{priority:3,time:2},no:{priority:-1}}],['予定を減らす方が、効率化より先？',{yes:{scope:2,priority:2},no:{time:1}}]],
health:[['考える前に、休息や体調回復が必要？',{yes:{energy:3,emotion:1},no:{energy:-1}}],['今の判断力が普段より落ちてる感じがある？',{yes:{energy:2,risk:1},no:{energy:-1}}],['安全に関わる可能性がある？',{yes:{risk:4,urgency:2},no:{risk:-1}}]],
study:[['分からないより、手を動かす量が足りない？',{yes:{action:2,learning:1},no:{information:2,learning:2}}],['練習結果をすぐ確認できる？',{yes:{feedback:2},no:{feedback:3,experiment:1}}],['完璧に理解してから進もうとしてる？',{yes:{friction:2,experiment:2},no:{friction:-1}}]],
creative:[['評価する前に、案を増やす時間を取った？',{yes:{creative:-1},no:{creative:3,options:2}}],['完成品ではなく試作品を作れる？',{yes:{experiment:3,feedback:2},no:{scope:1}}],['他人に見せる前に整えすぎてる？',{yes:{friction:2,feedback:2},no:{friction:-1}}]],
system:[['同じ問題が何度も起きてる？',{yes:{repeat:3,system:2},no:{repeat:-1}}],['誰か一人ではなく、ルールが原因？',{yes:{system:4,incentive:2},no:{system:-1}}],['みんな合理的に動いてるのに悪い結果になる？',{yes:{incentive:4,system:3},no:{incentive:-1}}]],
risk:[['一度決めたら、元に戻しにくい？',{yes:{reversibility:4,risk:3},no:{reversibility:-2,experiment:1}}],['最悪の場合に耐えられる？',{yes:{risk:-1},no:{risk:4}}],['小さく試すことで損失を限定できる？',{yes:{experiment:3,risk:-1},no:{risk:1}}]]};
Object.entries(bank).forEach(([g,arr])=>arr.forEach(([t,w])=>add(g,t,labels[g]||'診断',w,g)));
const stems=[['いまの判断は、一度保留しても状況が悪化しない？',{yes:{urgency:-1,information:1},no:{urgency:2}}],['その問題は、自分の行動だけで少し改善できる？',{yes:{control:2,action:1},no:{dependency:2}}],['いま必要なのは、答えより先に一回試すこと？',{yes:{experiment:3,decision:-1},no:{information:1}}],['このまま進むと、同じ失敗を繰り返しそう？',{yes:{repeat:2,system:1},no:{repeat:-1}}],['考え続けるより、判断基準を一つ決める方が進みそう？',{yes:{priority:2,decision:2},no:{information:1}}],['誰かに頼ることで、状況が大きく変わりそう？',{yes:{dependency:1,coordination:2},no:{control:1}}],['問題を小さくすると、今日中に一歩進められそう？',{yes:{scope:-1,action:2},no:{scope:2}}],['結果を見ながら、途中で修正できる？',{yes:{feedback:2,reversibility:-1},no:{reversibility:2}}],['いま止まっているのは、選択肢不足より優先順位の問題？',{yes:{priority:3},no:{options:2}}],['相手や環境より、自分の決め方を変える方が早い？',{yes:{control:2,decision:1},no:{system:1}}]];
const contexts=['money','time','relation','study','career','health','emotion','creative','system','risk'];for(let i=0;i<240;i++){const [t,w]=stems[i%stems.length];const d=contexts[i%contexts.length];add(d,t,labels[d]||'診断',w,d)}
const concrete=[
['action','今日このあと実際に手を付ける時間を決めてある？','行動',{yes:{followthrough:-1,action:-1},no:{followthrough:3,friction:2}},null],
['action','必要な道具や連絡先を、今すぐ取り出せる？','行動',{yes:{resourcegap:-1},no:{resourcegap:3,friction:2}},null],
['action','最初の一歩が30分以上かかる形になってる？','行動',{yes:{scope:2,friction:2},no:{scope:-1}},null],
['action','一度始めても、次に何をするか迷いそう？','行動',{yes:{sequencing:3,followthrough:2},no:{sequencing:-1}},null],
['action','始めるより、途中で止まる方がいつもの問題？','行動',{yes:{maintenance:3,followthrough:3},no:{friction:1}},null],
['decision','選んだあとに「別の方がよかった」と何度も見直しそう？','決め方',{yes:{overthinking:3,commitment:2},no:{overthinking:-1}},null],
['decision','一番大事な条件より、目先の楽さを優先しそう？','決め方',{yes:{shortterm:3,priority:2},no:{shortterm:-1}},null],
['decision','誰かに決めてもらえたら楽だと思う？','決め方',{yes:{ownership:3,avoidance:2},no:{ownership:-1}},null],
['information','数字や事実を一つ取れば、かなり判断が変わる？','情報',{yes:{measurement:3,information:2},no:{measurement:-1}},null],
['information','確認できるのに、相手の気持ちを想像だけで補ってる？','情報',{yes:{socialguess:4,evidence:2},no:{socialguess:-1}},'relation'],
['information','情報を集めるほど、決めるのが遅くなってる？','情報',{yes:{overthinking:4,information:-1},no:{overthinking:-1}},null],
['relation','自分の望みを、相手に合わせて小さくしすぎてる？','人との間',{yes:{selfinterest:3,boundary:2},no:{selfinterest:-1}},'relation'],
['relation','相手に公平であることと、自分が我慢することを同じにしてる？','人との間',{yes:{fairness:3,boundary:2},no:{fairness:-1}},'relation'],
['relation','相手の反応を確かめる前に、悪い展開を決めつけてる？','人との間',{yes:{socialguess:4,fear:2},no:{socialguess:-1}},'relation'],

    <div class="side-block"><h3>裏で使った考え方</h3><div class="tag-wrap">${r.methods.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>
    <div class="side-block"><h3>今は避けること</h3><div class="warning">${r.warn}</div></div>
    <div class="side-block"><h3>診断で強く出た要素</h3><div class="score-list">${tops.map(([k,v])=>`<div class="score-row"><span>${labels[k]||k}</span><div class="score-bar"><span style="width:${Math.max(10,v/max*100)}%"></span></div><b>${v}</b></div>`).join('')}</div></div>
    <div class="side-block"><h3>次の確認ポイント</h3><div class="secondary-actions">
      <div class="secondary-action">実行後に、何が変わったか一つだけ記録する。</div>
      <div class="secondary-action">結果が悪ければ、失敗ではなく質問の前提を一つ修正する。</div>
    </div></div>
    <div class="history">${state.questionNo}問で仮結論。自由文は診断に使用していません。質問バンク ${Q.length}件、内部変数 ${vars.length}個。</div>
  </aside></div>`;show('resultScreen')
}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}function reset(){state.setup={};state.scores={};vars.forEach(v=>state.scores[v]=0);state.asked=[];state.answers={};state.lastGroups=[];state.questionNo=0;state.maxQuestions=15;renderSetup();show('setupScreen')}
$('startBtn').onclick=()=>{seed();showQuestion()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.answer));$('moreBtn').onclick=()=>{state.maxQuestions=state.questionNo+6;showQuestion()};$('restartBtn').onclick=reset;renderSetup();
</script></body></html>
