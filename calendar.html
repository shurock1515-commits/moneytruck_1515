<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar | Money IF</title>
<style>
:root{
  --bg:#07111f;
  --bg2:#0d1b32;
  --panel:rgba(14,27,48,.78);
  --panel2:rgba(20,39,67,.68);
  --text:#f4f7ff;
  --muted:#91a3bf;
  --line:rgba(255,255,255,.10);
  --blue:#75aaff;
  --mint:#7cf0cf;
  --violet:#b78cff;
  --orange:#ffb36b;
  --danger:#ff7f9f;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Inter,"Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 8%,rgba(102,158,233,.22),transparent 28%),
    radial-gradient(circle at 89% 12%,rgba(183,140,255,.16),transparent 24%),
    linear-gradient(155deg,#050d18 0%,#091625 48%,#0b1931 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent 90%);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.home-return{
  position:fixed;
  z-index:1000;
  top:16px;
  left:16px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  min-height:46px;
  padding:5px 15px 5px 6px;
  color:var(--text);
  text-decoration:none;
  font-size:.8rem;
  font-weight:850;
  letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.15);
  border-radius:999px;
  background:rgba(8,18,34,.72);
  box-shadow:0 14px 34px rgba(0,0,0,.26);
  backdrop-filter:blur(18px);
}
.home-return-icon{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,var(--blue),var(--mint));
  position:relative;
}
.home-return-icon::before{
  content:"";
  width:10px;
  height:10px;
  border-left:2px solid #07111f;
  border-bottom:2px solid #07111f;
  transform:rotate(45deg);
  margin-left:4px;
}
.shell{
  width:min(1450px,calc(100% - 32px));
  margin:auto;
  padding:86px 0 48px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:22px;
}
.eyebrow{
  color:var(--mint);
  font-size:.73rem;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
}
h1{
  margin:8px 0 0;
  font-size:clamp(2rem,5vw,4.5rem);
  letter-spacing:-.06em;
}
.header-note{
  max-width:430px;
  color:var(--muted);
  line-height:1.75;
  font-size:.88rem;
  text-align:right;
}
.layout{
  display:grid;
  grid-template-columns:minmax(300px,390px) minmax(0,1fr);
  gap:18px;
  align-items:start;
}
.panel{
  border:1px solid var(--line);
  border-radius:28px;
  background:var(--panel);
  box-shadow:0 26px 70px rgba(0,0,0,.28);
  backdrop-filter:blur(20px);
  overflow:hidden;
}
.panel-inner{padding:22px}
.form-panel{
  position:sticky;
  top:18px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
}
.section-head h2{
  margin:0;
  font-size:1.15rem;
}
.badge{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 9px;
  color:var(--muted);
  font-size:.67rem;
  letter-spacing:.08em;
}
.form-grid{
  display:grid;
  gap:13px;
}
label{
  display:grid;
  gap:7px;
  color:var(--muted);
  font-size:.8rem;
}
input,select,textarea{
  width:100%;
  border:1px solid rgba(255,255,255,.10);
  border-radius:15px;
  padding:12px 13px;
  color:var(--text);
  background:rgba(255,255,255,.045);
  outline:none;
}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:rgba(117,170,255,.65);
  box-shadow:0 0 0 4px rgba(117,170,255,.10);
}
.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.actions{
  display:flex;
  gap:9px;
  margin-top:4px;
}
.primary,.ghost,.danger{
  min-height:44px;
  border-radius:14px;
  border:0;
  padding:0 16px;
  font-weight:800;
}
.primary{
  flex:1;
  color:#07111f;
  background:linear-gradient(135deg,var(--blue),var(--mint));
}
.ghost{
  color:var(--text);
  background:rgba(255,255,255,.07);
  border:1px solid var(--line);
}
.danger{
  color:#ffdce5;
  background:rgba(255,127,159,.12);
  border:1px solid rgba(255,127,159,.22);
}
.today-summary{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.today-summary h3{
  margin:0 0 10px;
  font-size:.92rem;
}
.agenda{
  display:grid;
  gap:8px;
}
.agenda-item{
  padding:11px 12px;
  border-radius:14px;
  background:rgba(255,255,255,.045);
  border-left:4px solid var(--blue);
}
.agenda-item strong{
  display:block;
  font-size:.86rem;
}
.agenda-item span{
  color:var(--muted);
  font-size:.74rem;
}
.empty{
  color:var(--muted);
  font-size:.82rem;
  padding:8px 0;
}
.calendar-panel .panel-inner{padding:18px}
.calendar-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}
.calendar-nav{
  display:flex;
  align-items:center;
  gap:8px;
}
.calendar-nav button{
  width:40px;
  height:40px;
  border-radius:50%;
  color:var(--text);
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
}
.month-title{
  min-width:190px;
  text-align:center;
  font-size:1.35rem;
  font-weight:850;
}
.today-btn{
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  color:var(--text);
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
}
.weekdays,.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}
.weekdays{
  color:var(--muted);
  font-size:.72rem;
  text-align:center;
  margin-bottom:7px;
}
.weekdays div{padding:7px 0}
.calendar-grid{
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}
.day{
  min-height:122px;
  padding:10px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.018);
  transition:background .16s ease,transform .16s ease;
  cursor:pointer;
  overflow:hidden;
}
.day:hover{
  background:rgba(255,255,255,.055);
}
.day.other{opacity:.33}
.day.selected{
  background:linear-gradient(145deg,rgba(117,170,255,.18),rgba(124,240,207,.08));
  box-shadow:inset 0 0 0 2px rgba(117,170,255,.42);
}
.day.today .day-number{
  color:#07111f;
  background:linear-gradient(135deg,var(--blue),var(--mint));
}
.day-number{
  width:28px;
  height:28px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:.78rem;
  font-weight:800;
  margin-bottom:7px;
}
.event-chip{
  display:block;
  margin-top:5px;
  padding:5px 7px;
  border-radius:8px;
  font-size:.68rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#eef5ff;
  background:rgba(117,170,255,.20);
  border-left:3px solid var(--blue);
}
.event-chip.study{border-color:var(--violet);background:rgba(183,140,255,.16)}
.event-chip.work{border-color:var(--orange);background:rgba(255,179,107,.16)}
.event-chip.private{border-color:var(--mint);background:rgba(124,240,207,.14)}
.event-chip.important{border-color:var(--danger);background:rgba(255,127,159,.15)}
.more{
  margin-top:5px;
  color:var(--muted);
  font-size:.66rem;
}
.detail-panel{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:16px;
}
.detail-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}
.detail-title h3{margin:0;font-size:1rem}
.detail-list{
  display:grid;
  gap:9px;
}
.detail-item{
  display:grid;
  grid-template-columns:70px 1fr auto;
  gap:10px;
  align-items:start;
  padding:12px;
  border-radius:15px;
  background:rgba(255,255,255,.04);
}
.detail-time{
  color:var(--mint);
  font-size:.78rem;
  font-weight:800;
}
.detail-main strong{display:block;font-size:.88rem}
.detail-main p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:.75rem;
  line-height:1.55;
}
.icon-btn{
  width:34px;
  height:34px;
  border-radius:10px;
  color:#ffdce5;
  background:rgba(255,127,159,.10);
  border:1px solid rgba(255,127,159,.17);
}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .form-panel{position:static}
  .calendar-grid{min-width:850px}
  .calendar-scroll{overflow-x:auto}
}
@media(max-width:620px){
  .shell{width:min(100% - 18px,1450px);padding-top:76px}
  .header{align-items:start;flex-direction:column}
  .header-note{text-align:left}
  .panel-inner{padding:16px}
  .two{grid-template-columns:1fr}
  .home-return span:last-child{display:none}
}

/* Select visibility fix */
select{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  background:
    linear-gradient(45deg,transparent 50%,#9fc3ea 50%) calc(100% - 18px) calc(50% - 3px)/6px 6px no-repeat,
    linear-gradient(135deg,#9fc3ea 50%,transparent 50%) calc(100% - 12px) calc(50% - 3px)/6px 6px no-repeat,
    rgba(43,65,96,.96) !important;
  color:#f4f7ff !important;
  border:1px solid rgba(159,195,234,.28) !important;
  padding-right:42px !important;
}
select:hover{
  background:
    linear-gradient(45deg,transparent 50%,#bfe0ff 50%) calc(100% - 18px) calc(50% - 3px)/6px 6px no-repeat,
    linear-gradient(135deg,#bfe0ff 50%,transparent 50%) calc(100% - 12px) calc(50% - 3px)/6px 6px no-repeat,
    rgba(51,77,112,.98) !important;
}
select:focus{
  background:
    linear-gradient(45deg,transparent 50%,#d6ebff 50%) calc(100% - 18px) calc(50% - 3px)/6px 6px no-repeat,
    linear-gradient(135deg,#d6ebff 50%,transparent 50%) calc(100% - 12px) calc(50% - 3px)/6px 6px no-repeat,
    rgba(56,84,121,.98) !important;
  color:#ffffff !important;
}
select option{
  background:#1f3552 !important;
  color:#f4f7ff !important;
}
select option:checked{
  background:#315986 !important;
  color:#ffffff !important;
}
input[type="date"],
input[type="time"]{
  background:rgba(255,255,255,.07);
}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{
  filter:invert(85%) sepia(12%) saturate(789%) hue-rotate(177deg) brightness(102%) contrast(92%);
  opacity:.95;
  cursor:pointer;
}


.notification-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  padding:12px 14px;
  border-radius:16px;
  background:rgba(117,170,255,.08);
  border:1px solid rgba(117,170,255,.17);
}
.notification-bar strong{
  display:block;
  font-size:.82rem;
}
.notification-bar span{
  color:var(--muted);
  font-size:.72rem;
}
.notify-btn{
  flex:0 0 auto;
  min-height:38px;
  padding:0 13px;
  border-radius:999px;
  border:0;
  color:#07111f;
  background:linear-gradient(135deg,var(--blue),var(--mint));
  font-weight:850;
}
.notify-btn:disabled{
  opacity:.5;
  cursor:default;
}
.toast-stack{
  position:fixed;
  z-index:2000;
  top:18px;
  right:18px;
  display:grid;
  gap:10px;
  width:min(360px,calc(100% - 36px));
  pointer-events:none;
}
.toast{
  pointer-events:auto;
  padding:15px 16px;
  border-radius:17px;
  color:#f7faff;
  background:rgba(18,36,61,.96);
  border:1px solid rgba(124,240,207,.24);
  box-shadow:0 20px 50px rgba(0,0,0,.32);
  animation:toastIn .22s ease both;
}
.toast strong{
  display:block;
  margin-bottom:4px;
}
.toast span{
  color:#b8c9de;
  font-size:.78rem;
}
@keyframes toastIn{
  from{opacity:0;transform:translateY(-8px) scale(.98)}
  to{opacity:1;transform:none}
}
.notify-chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:5px;
  color:#bcd6f3;
  font-size:.68rem;
}


.expense-toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 14px;
  border-radius:16px;
  background:rgba(124,240,207,.07);
  border:1px solid rgba(124,240,207,.16);
}
.expense-toggle div strong{
  display:block;
  color:var(--text);
  font-size:.84rem;
}
.expense-toggle div span{
  color:var(--muted);
  font-size:.72rem;
}
.expense-switch{
  flex:0 0 auto;
  min-width:112px;
  min-height:38px;
  border:1px solid rgba(124,240,207,.22);
  border-radius:999px;
  color:#c5d5e8;
  background:rgba(255,255,255,.06);
  font-weight:800;
}
.expense-switch.active{
  color:#07111f;
  background:linear-gradient(135deg,var(--mint),var(--blue));
}
.expense-fields{
  display:none;
  gap:10px;
  grid-template-columns:1fr 1fr;
  padding:13px;
  border-radius:16px;
  background:rgba(117,170,255,.06);
}
.expense-fields.show{display:grid}
.expense-mark{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
  color:#ffd594;
  font-size:.68rem;
}
@media(max-width:620px){
  .expense-fields{grid-template-columns:1fr}
}


.money-toggle{
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 12px;
  border-radius:14px;
  background:rgba(255,255,255,.045);
}
.money-toggle input{
  width:auto;
  accent-color:var(--mint);
}
.money-fields{
  display:none;
  gap:10px;
}
.money-fields.active{
  display:grid;
}
.money-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
  padding:3px 7px;
  border-radius:999px;
  font-size:.67rem;
  font-weight:800;
}
.money-badge.expense{
  color:#ffd4df;
  background:rgba(255,127,159,.13);
}
.money-badge.income{
  color:#c9ffef;
  background:rgba(124,240,207,.12);
}

</style>
</head>
<body>
<div id="toastStack" class="toast-stack" aria-live="polite"></div>
<a class="home-return" href="index.html" aria-label="ホームへ戻る">
  <span class="home-return-icon" aria-hidden="true"></span>
  <span>HOME</span>
</a>

<main class="shell">
  <header class="header">
    <div>
      <div class="eyebrow">Schedule control</div>
      <h1>Calendar</h1>
    </div>
    <p class="header-note">
      左で予定を登録し、右で月全体を見る。日付を押すと、その日の予定を下にまとめて表示します。
    </p>
  </header>

  <div class="layout">
    <section class="panel form-panel">
      <div class="panel-inner">
        <div class="section-head">
          <h2>予定を追加</h2>
          <span class="badge">NEW EVENT</span>
        </div>

        <div class="notification-bar">
          <div>
            <strong>予定通知</strong>
            <span id="notificationStatus">通知の状態を確認しています</span>
          </div>
          <button id="enableNotifications" class="notify-btn" type="button">通知を許可</button>
        </div>

        <div class="form-grid">
          <label>
            タイトル
            <input id="eventTitle" type="text" placeholder="例：物理のテスト">
          </label>

          <div class="two">
            <label>
              日付
              <input id="eventDate" type="date">
            </label>
            <label>
              種類
              <select id="eventType">
                <option value="private">プライベート</option>
                <option value="study">学業</option>
                <option value="work">仕事・バイト</option>
                <option value="important">重要</option>
              </select>
            </label>
          </div>

          <div class="two">
            <label>
              開始
              <input id="eventStart" type="time">
            </label>
            <label>
              終了
              <input id="eventEnd" type="time">
            </label>
          </div>

          <label>
            通知
            <select id="eventReminder">
              <option value="none">通知しない</option>
              <option value="0">開始時刻</option>
              <option value="5">5分前</option>
              <option value="10">10分前</option>
              <option value="30">30分前</option>
              <option value="60">1時間前</option>
              <option value="1440">1日前</option>
            </select>
          </label>

          <div class="expense-toggle">
            <div>
              <strong>この予定を支出予定にする</strong>
              <span>資産管理に金額と支払日を連携します</span>
            </div>
            <button id="expenseToggle" class="expense-switch" type="button" aria-pressed="false">支出なし</button>
          </div>

          <div id="expenseFields" class="expense-fields">
            <label>
              予定金額
              <input id="eventExpenseAmount" type="number" min="0" step="100" placeholder="15000">
            </label>
            <label>
              支出の重要度
              <select id="eventExpensePriority">
                <option value="essential">必ず必要</option>
                <option value="important">できれば守る</option>
                <option value="optional">削ってもよい</option>
              </select>
            </label>
          </div>

          <label class="money-toggle">
            <input id="hasMoneyFlow" type="checkbox">
            この予定でお金が動く
          </label>

          <div id="moneyFields" class="money-fields two">
            <label>
              種類
              <select id="moneyFlowType">
                <option value="expense">支出</option>
                <option value="income">収入</option>
              </select>
            </label>
            <label>
              金額
              <input id="moneyFlowAmount" type="number" min="0" step="100" placeholder="10000">
            </label>
          </div>

          <label>
            メモ
            <textarea id="eventMemo" placeholder="場所、持ち物、内容など"></textarea>
          </label>

          <div class="actions">
            <button id="addEvent" class="primary" type="button">予定を保存</button>
            <button id="clearForm" class="ghost" type="button">クリア</button>
          </div>
        </div>

        <div class="today-summary">
          <h3 id="quickTitle">選択日の予定</h3>
          <div id="quickAgenda" class="agenda"></div>
        </div>
      </div>
    </section>

    <section class="panel calendar-panel">
      <div class="panel-inner">
        <div class="calendar-top">
          <div class="calendar-nav">
            <button id="prevMonth" type="button" aria-label="前の月">‹</button>
            <div id="monthTitle" class="month-title"></div>
            <button id="nextMonth" type="button" aria-label="次の月">›</button>
          </div>
          <button id="goToday" class="today-btn" type="button">今日</button>
        </div>

        <div class="calendar-scroll">
          <div class="weekdays">
            <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>

        <div class="detail-panel">
          <div class="detail-title">
            <h3 id="detailDate">予定</h3>
            <span id="detailCount" class="badge">0 EVENTS</span>
          </div>
          <div id="detailList" class="detail-list"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
const STORAGE_KEY="money-if-calendar-events-v1";
const PLANNED_EXPENSES_KEY="money-if-planned-expenses-v1";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const yen=n=>`${Math.round(Number(n)||0).toLocaleString("ja-JP")}円`;
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=new Date();
let viewDate=new Date(today.getFullYear(),today.getMonth(),1);
let selectedDate=dateKey(today);

function loadEvents(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    return Array.isArray(data)?data:[];
  }catch{
    return [];
  }
}
function saveEvents(events){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
}
function loadLinkedExpenses(){
  try{
    const data=JSON.parse(localStorage.getItem(PLANNED_EXPENSES_KEY)||"[]");
    return Array.isArray(data)?data:[];
  }catch{
    return [];
  }
}
function saveLinkedExpenses(items){
  localStorage.setItem(PLANNED_EXPENSES_KEY,JSON.stringify(items));
}
function upsertLinkedExpense(event){
  const items=loadLinkedExpenses();
  const filtered=items.filter(item=>item.calendarEventId!==event.id);
  if(event.isExpense&&event.expenseAmount>0){
    filtered.push({
      id:event.expenseId||("cal-exp-"+event.id),
      calendarEventId:event.id,
      source:"calendar",
      name:event.title,
      amount:event.expenseAmount,
      date:event.date,
      priority:event.expensePriority||"important"
    });
  }
  saveLinkedExpenses(filtered);
}
function removeLinkedExpense(eventId){
  saveLinkedExpenses(loadLinkedExpenses().filter(item=>item.calendarEventId!==eventId));
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[ch]);
}
function typeLabel(type){
  return {private:"プライベート",study:"学業",work:"仕事・バイト",important:"重要"}[type]||"予定";
}
function reminderLabel(value){
  const labels={
    "0":"開始時刻",
    "5":"5分前",
    "10":"10分前",
    "30":"30分前",
    "60":"1時間前",
    "1440":"1日前"
  };
  return labels[String(value)]||"なし";
}
function updateNotificationUI(){
  const status=$("notificationStatus");
  const button=$("enableNotifications");
  if(!("Notification" in window)){
    status.textContent="このブラウザは通知に対応していません";
    button.disabled=true;
    return;
  }
  if(Notification.permission==="granted"){
    status.textContent="通知は有効です（ページを開いている間）";
    button.textContent="通知オン";
    button.disabled=true;
  }else if(Notification.permission==="denied"){
    status.textContent="通知がブロックされています。ブラウザ設定から変更してください";
    button.textContent="ブロック中";
    button.disabled=true;
  }else{
    status.textContent="予定時刻にブラウザ通知を出せます";
    button.textContent="通知を許可";
    button.disabled=false;
  }
}
async function requestNotifications(){
  if(!("Notification" in window))return;
  try{
    await Notification.requestPermission();
  }catch{}
  updateNotificationUI();
}
function showToast(event){
  const stack=$("toastStack");
  const toast=document.createElement("div");
  toast.className="toast";
  toast.innerHTML=`
    <strong>${escapeHtml(event.title)}</strong>
    <span>${event.start||"時刻未定"}${event.memo?`・${escapeHtml(event.memo)}`:""}</span>
  `;
  stack.appendChild(toast);
  setTimeout(()=>toast.remove(),9000);
}
function notifyEvent(event){
  showToast(event);
  if("Notification" in window&&Notification.permission==="granted"){
    try{
      new Notification(event.title,{
        body:`${event.start||"時刻未定"}${event.memo?`・${event.memo}`:""}`,
        tag:`money-if-${event.id}`,
        renotify:false
      });
    }catch{}
  }
}
function notificationTime(event){
  if(!event.date||!event.start||!event.reminder||event.reminder==="none")return null;
  const start=new Date(`${event.date}T${event.start}:00`);
  return start.getTime()-(Number(event.reminder)||0)*60000;
}
function checkNotifications(){
  const now=Date.now();
  const events=loadEvents();
  let changed=false;
  for(const event of events){
    const target=notificationTime(event);
    if(target===null)continue;
    const key=`${event.date}|${event.start}|${event.reminder}`;
    if(event.lastNotifiedKey===key)continue;
    // 予定通知時刻から10分以内、またはバックグラウンドから戻った直後の遅延通知
    if(now>=target&&now-target<=10*60*1000){
      notifyEvent(event);
      event.lastNotifiedKey=key;
      changed=true;
    }
  }
  if(changed)saveEvents(events);
}

function formatDateJP(key){
  const d=new Date(key+"T00:00:00");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function sortEvents(events){
  return [...events].sort((a,b)=>(a.start||"99:99").localeCompare(b.start||"99:99"));
}
function renderCalendar(){
  const year=viewDate.getFullYear();
  const month=viewDate.getMonth();
  $("monthTitle").textContent=`${year}年 ${month+1}月`;

  const first=new Date(year,month,1);
  const start=new Date(year,month,1-first.getDay());
  const events=loadEvents();
  const grid=$("calendarGrid");
  grid.innerHTML="";

  for(let i=0;i<42;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const key=dateKey(d);
    const dayEvents=sortEvents(events.filter(e=>e.date===key));

    const cell=document.createElement("div");
    cell.className="day";
    if(d.getMonth()!==month)cell.classList.add("other");
    if(key===dateKey(today))cell.classList.add("today");
    if(key===selectedDate)cell.classList.add("selected");

    const chips=dayEvents.slice(0,3).map(event=>`
      <span class="event-chip ${event.type}">
        ${event.start?event.start+" ":""}${escapeHtml(event.title)}
      </span>
    `).join("");

    cell.innerHTML=`
      <div class="day-number">${d.getDate()}</div>
      ${chips}
      ${dayEvents.length>3?`<div class="more">+${dayEvents.length-3}件</div>`:""}
    `;
    cell.addEventListener("click",()=>{
      selectedDate=key;
      $("eventDate").value=key;
      renderAll();
    });
    grid.appendChild(cell);
  }
}
function renderSelected(){
  const events=sortEvents(loadEvents().filter(e=>e.date===selectedDate));
  $("detailDate").textContent=`${formatDateJP(selectedDate)}の予定`;
  $("quickTitle").textContent=`${formatDateJP(selectedDate)}の予定`;
  $("detailCount").textContent=`${events.length} EVENTS`;

  if(!events.length){
    $("detailList").innerHTML='<div class="empty">予定はありません。</div>';
    $("quickAgenda").innerHTML='<div class="empty">予定はありません。</div>';
    return;
  }

  $("quickAgenda").innerHTML=events.slice(0,4).map(event=>`
    <div class="agenda-item" style="border-left-color:${event.type==="study"?"var(--violet)":event.type==="work"?"var(--orange)":event.type==="important"?"var(--danger)":"var(--mint)"}">
      <strong>${escapeHtml(event.title)}</strong>
      <span>${event.start||"時刻未定"}${event.end?` – ${event.end}`:""}・${typeLabel(event.type)}</span>
      ${event.moneyFlowAmount>0?`<span class="money-badge ${event.moneyFlowType}">${event.moneyFlowType==="income"?"+":"−"}${yen(event.moneyFlowAmount)}</span>`:""}
      ${event.reminder&&event.reminder!=="none"?`<span class="notify-chip">通知 ${reminderLabel(event.reminder)}</span>`:""}
      ${event.isExpense&&event.expenseAmount>0?`<span class="expense-mark">支出予定 ¥${Number(event.expenseAmount).toLocaleString("ja-JP")}</span>`:""}
    </div>
  `).join("");

  $("detailList").innerHTML=events.map(event=>`
    <div class="detail-item">
      <div class="detail-time">${event.start||"未定"}${event.end?`<br>– ${event.end}`:""}</div>
      <div class="detail-main">
        <strong>${escapeHtml(event.title)}</strong>
        <p>${typeLabel(event.type)}${event.reminder&&event.reminder!=="none"?`・通知 ${reminderLabel(event.reminder)}`:""}${event.isExpense&&event.expenseAmount>0?`・支出予定 ¥${Number(event.expenseAmount).toLocaleString("ja-JP")}`:""}${event.memo?`<br>${escapeHtml(event.memo)}`:""}</p>
      </div>
      <button class="icon-btn delete-event" data-id="${event.id}" type="button">×</button>
    </div>
  `).join("");

  document.querySelectorAll(".delete-event").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const eventId=btn.dataset.id;
      const next=loadEvents().filter(event=>event.id!==eventId);
      saveEvents(next);
      removeLinkedExpense(eventId);
      renderAll();
    });
  });
}
function renderAll(){
  renderCalendar();
  renderSelected();
}
function clearForm(){
  $("eventTitle").value="";
  $("eventStart").value="";
  $("eventEnd").value="";
  $("eventMemo").value="";
  $("eventType").value="private";
  $("eventReminder").value="none";
  $("hasMoneyFlow").checked=false;
  $("moneyFields").classList.remove("active");
  $("moneyFlowType").value="expense";
  $("moneyFlowAmount").value="";
  $("eventDate").value=selectedDate;
  $("eventExpenseAmount").value="";
  $("eventExpensePriority").value="important";
  setExpenseMode(false);
}

let expenseMode=false;
function setExpenseMode(enabled){
  expenseMode=Boolean(enabled);
  $("expenseFields").classList.toggle("show",expenseMode);
  $("expenseToggle").classList.toggle("active",expenseMode);
  $("expenseToggle").setAttribute("aria-pressed",String(expenseMode));
  $("expenseToggle").textContent=expenseMode?"支出予定オン":"支出なし";
}
function addEvent(){
  const title=$("eventTitle").value.trim();
  const date=$("eventDate").value;
  if(!title||!date)return;

  const events=loadEvents();
  const id=String(Date.now())+Math.random().toString(36).slice(2,7);
  const expenseAmount=Math.max(0,+$("eventExpenseAmount").value||0);
  if(expenseMode&&expenseAmount<=0){
    $("eventExpenseAmount").focus();
    return;
  }
  const newEvent={
    id,
    title,
    date,
    start:$("eventStart").value,
    end:$("eventEnd").value,
    type:$("eventType").value,
    reminder:$("eventReminder").value,
    lastNotifiedKey:"",
    isExpense:expenseMode,
    expenseAmount:expenseMode?expenseAmount:0,
    expensePriority:$("eventExpensePriority").value,
    expenseId:"cal-exp-"+id,
    memo:$("eventMemo").value.trim()
  };
  events.push(newEvent);
  saveEvents(events);
  upsertLinkedExpense(newEvent);
  selectedDate=date;
  const d=new Date(date+"T00:00:00");
  viewDate=new Date(d.getFullYear(),d.getMonth(),1);
  clearForm();
  renderAll();
}
$("expenseToggle").addEventListener("click",()=>setExpenseMode(!expenseMode));
$("addEvent").addEventListener("click",addEvent);
$("clearForm").addEventListener("click",clearForm);
$("prevMonth").addEventListener("click",()=>{
  viewDate.setMonth(viewDate.getMonth()-1);
  renderCalendar();
});
$("nextMonth").addEventListener("click",()=>{
  viewDate.setMonth(viewDate.getMonth()+1);
  renderCalendar();
});
$("goToday").addEventListener("click",()=>{
  viewDate=new Date(today.getFullYear(),today.getMonth(),1);
  selectedDate=dateKey(today);
  $("eventDate").value=selectedDate;
  renderAll();
});
$("eventTitle").addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    event.preventDefault();
    addEvent();
  }
});

$("hasMoneyFlow").addEventListener("change",()=>{
  $("moneyFields").classList.toggle("active",$("hasMoneyFlow").checked);
});
$("enableNotifications").addEventListener("click",requestNotifications);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)checkNotifications();
});
window.addEventListener("focus",checkNotifications);
setExpenseMode(false);
$("eventDate").value=selectedDate;
updateNotificationUI();
renderAll();
checkNotifications();
setInterval(checkNotifications,30000);
</script>
</body>
</html>
