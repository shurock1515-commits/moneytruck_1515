<style>
:root{--bg:#06101d;--panel:rgba(16,31,53,.84);--text:#f5f8ff;--muted:#96a8c1;--line:rgba(255,255,255,.1);--blue:#74a9ff;--mint:#76efcc;--violet:#b693ff;--orange:#ffb36c;--pink:#ff8eb0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;background:radial-gradient(circle at 12% 7%,rgba(90,147,227,.24),transparent 28%),radial-gradient(circle at 88% 10%,rgba(177,127,255,.18),transparent 24%),linear-gradient(155deg,#040b14,#081525 48%,#0b1930)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 92%)}button{font:inherit;cursor:pointer}.home{position:fixed;z-index:30;top:15px;left:15px;display:flex;align-items:center;gap:9px;padding:6px 15px 6px 7px;border-radius:999px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:rgba(8,20,36,.82);backdrop-filter:blur(18px);box-shadow:0 15px 38px rgba(0,0,0,.3);font-size:.78rem;font-weight:850;letter-spacing:.08em}.home i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue),var(--mint))}.home i:before{content:"";width:9px;height:9px;border-left:2px solid #07131f;border-bottom:2px solid #07131f;transform:rotate(45deg);margin-left:4px}.shell{width:min(1180px,calc(100% - 30px));margin:auto;padding:86px 0 50px}.hero{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:24px}.eyebrow{color:var(--mint);font-size:.72rem;font-weight:850;letter-spacing:.18em;text-transform:uppercase}h1{margin:7px 0 0;font-size:clamp(2.4rem,7vw,5.5rem);letter-spacing:-.07em;line-height:.95}.hero p{max-width:420px;color:var(--muted);line-height:1.75;font-size:.88rem;text-align:right}.panel{border:1px solid var(--line);border-radius:30px;background:var(--panel);box-shadow:0 28px 80px rgba(0,0,0,.3);backdrop-filter:blur(22px);overflow:hidden}.inner{padding:24px}.screen{display:none}.screen.active{display:block}.step-title{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:20px}.step-title h2{margin:0;font-size:1.25rem}.step-title p{margin:6px 0 0;color:var(--muted);font-size:.8rem}.badge{padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.68rem}.group{margin-top:20px}.group h3{margin:0 0 10px;font-size:.9rem}.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}.choice{min-height:62px;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--text);text-align:left;font-weight:750;transition:.15s ease}.choice:hover{transform:translateY(-2px);background:rgba(255,255,255,.065)}.choice.selected{border-color:rgba(118,239,204,.6);background:rgba(118,239,204,.11);box-shadow:0 0 0 3px rgba(118,239,204,.07)}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.primary,.ghost{min-height:46px;padding:0 18px;border-radius:14px;border:0;font-weight:850}.primary{color:#06101d;background:linear-gradient(135deg,var(--blue),var(--mint))}.ghost{color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line)}.primary:disabled{opacity:.35;cursor:not-allowed}.question-wrap{min-height:460px;display:grid;place-items:center;text-align:center;padding:28px}.question-card{width:min(760px,100%)}.progress-line{height:5px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;margin-bottom:30px}.progress-line span{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--blue),var(--mint));transition:.3s ease}.question-kicker{color:var(--muted);font-size:.75rem;letter-spacing:.11em;text-transform:uppercase}.question{font-size:clamp(1.65rem,4vw,3.15rem);line-height:1.32;letter-spacing:-.04em;margin:14px auto 25px;max-width:760px}.answer-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answer{min-width:150px;min-height:58px;border-radius:18px;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.045);font-weight:850;font-size:1rem}.answer:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}.question-meta{display:flex;justify-content:center;gap:14px;margin-top:18px;color:var(--muted);font-size:.72rem}.result-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.result-main,.result-side{padding:22px;border-radius:22px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.result-label{color:var(--mint);font-size:.72rem;font-weight:850;letter-spacing:.13em}.result-main h2{font-size:clamp(1.8rem,4vw,3.3rem);margin:8px 0 12px;letter-spacing:-.05em}.result-main>p{color:#d7e1ef;line-height:1.8}.action-list{display:grid;gap:10px;margin-top:20px}.action-item{display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:start;padding:13px;border-radius:16px;background:rgba(255,255,255,.045)}.action-item b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#07131f;background:linear-gradient(145deg,var(--blue),var(--mint))}.action-item strong{display:block;margin-bottom:4px}.action-item span{color:var(--muted);font-size:.8rem;line-height:1.55}.side-block{margin-bottom:18px}.side-block h3{font-size:.83rem;margin:0 0 9px;color:var(--muted)}.tag-wrap{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:999px;background:rgba(116,169,255,.11);color:#cfe1ff;font-size:.72rem}.warning{padding:13px 14px;border-radius:15px;background:rgba(255,179,108,.09);border-left:4px solid var(--orange);line-height:1.6;font-size:.8rem}.score-list{display:grid;gap:8px}.score-row{display:grid;grid-template-columns:110px 1fr 32px;gap:8px;align-items:center;font-size:.72rem;color:var(--muted)}.score-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.score-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue))}.history{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem}@media(max-width:760px){.hero{display:block}.hero p{text-align:left}.result-layout{grid-template-columns:1fr}.question-wrap{padding:18px 8px}.answer{min-width:120px;flex:1}.home span{display:none}.shell{padding-top:74px}}
</style></head>
<body><a class="home" href="index.html"><i></i><span>HOME</span></a><main class="shell"><header class="hero"><div><div class="eyebrow">Adaptive problem solving</div><h1>Decision Lab</h1></div><p>問題文を読まずに、状況と答え方から「次に何をするか」を組み立てる。質問は一問ずつ、必要なものだけ。</p></header><section class="panel">
<div id="setupScreen" class="screen active inner"><div class="step-title"><div><h2>最初に、問題の地形だけ教えて</h2><p>文章は使わない。選択肢だけで質問の入口を決めます。</p></div><span class="badge">STEP 1</span></div><div id="setupGroups"></div><div class="footer-actions"><button id="startBtn" class="primary" disabled>診断をはじめる</button></div></div>
<div id="questionScreen" class="screen"><div class="question-wrap"><div class="question-card"><div class="progress-line"><span id="progressBar"></span></div><div id="questionKicker" class="question-kicker"></div><div id="questionText" class="question"></div><div class="answer-row"><button class="answer" data-answer="yes">YES</button><button class="answer" data-answer="no">NO</button><button class="answer" data-answer="unknown">わからない</button><button class="answer" data-answer="na">該当しない</button></div><div class="question-meta"><span id="questionCount"></span><span id="branchHint"></span></div></div></div></div>
<div id="resultScreen" class="screen inner"><div class="step-title"><div><h2>いまの仮結論</h2><p>必要なら、追加質問で精度を上げられます。</p></div><span class="badge">RESULT</span></div><div id="resultContent"></div><div class="footer-actions"><button id="moreBtn" class="ghost">もう少し絞る</button><button id="restartBtn" class="primary">最初から</button></div></div>
</section></main>
<script>
const setupConfig=[
{id:'time',title:'いつまでに動く？',multi:false,options:[['today','今日〜3日'],['week','1週間くらい'],['month','1か月くらい'],['long','数か月以上'],['unknown','まだ分からない']]},
{id:'people',title:'誰が関わる？',multi:false,options:[['self','自分だけ'],['one','特定の相手1人'],['group','少人数'],['org','学校・会社・組織'],['public','不特定多数']]},
{id:'domains',title:'何が絡む？',multi:true,options:[['money','お金'],['time','時間'],['relation','人間関係'],['study','学業・能力'],['career','仕事・進路'],['health','健康・体力'],['emotion','感情'],['creative','創作'],['system','ルール・制度'],['risk','安全・リスク']]},
{id:'stage',title:'どこで止まってる？',multi:true,max:2,options:[['unclear','問題がぼんやり'],['cause','原因が分からない'],['info','情報不足'],['ideas','案がない'],['choice','選べない'],['agreement','合意できない'],['action','動けない'],['stuck','動いても進まない'],['repeat','繰り返している'],['emotion','感情が強い']]},
{id:'control',title:'自分で動かせる範囲は？',multi:false,options:[['high','ほぼ自分で動かせる'],['medium','相手の協力が少し必要'],['joint','合意が必要'],['authority','許可が必要'],['low','環境次第'],['unknown','分からない']]},
{id:'reversibility',title:'失敗したら戻せる？',multi:false,options:[['easy','すぐ戻せる'],['some','少し損するが戻せる'],['hard','かなり損する'],['irreversible','ほぼ戻せない'],['unknown','分からない']]},
{id:'mindset',title:'今の気分は？',multi:true,max:2,options:[['fast','早く決めたい'],['careful','慎重に進めたい'],['confirm','考えを確認したい'],['fear','失敗が怖い'],['avoid','避けている'],['logic','合理的に考えたい'],['values','納得感もほしい']]}
];
const vars=['clarity','information','options','decision','action','friction','fear','reversibility','urgency','conflict','trust','coordination','boundary','incentive','control','system','habit','energy','emotion','money','time','risk','learning','creative','stakeholder','feedback','experiment','uncertainty','repeat','alignment','communication','evidence','priority','scope','dependency','permission','tradeoff'];
const labels={clarity:'問題の輪郭',information:'情報不足',options:'選択肢',decision:'意思決定',action:'行動',friction:'摩擦',fear:'不安',reversibility:'戻しやすさ',urgency:'緊急度',conflict:'利害衝突',trust:'信頼',coordination:'調整',boundary:'境界線',incentive:'動機設計',control:'制御可能性',system:'構造',habit:'習慣',energy:'実行エネルギー',emotion:'感情負荷',money:'金銭',time:'時間',risk:'リスク',learning:'学習',creative:'発想',stakeholder:'関係者',feedback:'検証',experiment:'小さな実験',uncertainty:'不確実性',repeat:'再発',alignment:'方向一致',communication:'伝え方',evidence:'根拠',priority:'優先順位',scope:'問題範囲',dependency:'依存関係',permission:'許可',tradeoff:'トレードオフ'};
const Q=[];let qn=0;const add=(group,text,kicker,w,domain=null)=>Q.push({id:'q'+(++qn),group,text,kicker,w,domain});
const bank={
clarity:[['解決したい状態は、頭の中ではっきりしてる？',{yes:{clarity:-2,action:1},no:{clarity:3,scope:2},unknown:{clarity:2}}],['問題を小さく一つに切れそう？',{yes:{scope:-2,action:1},no:{scope:3,clarity:1}}],['本当は別の問題が奥にある感じがする？',{yes:{clarity:3},no:{clarity:-1}}]],
information:[['決めるために足りない事実がある？',{yes:{information:3,evidence:2},no:{information:-2,decision:1}}],['誰かに一度聞けば分かることが残ってる？',{yes:{information:2,communication:1},no:{information:-1}}],['推測を事実として扱ってる部分がある？',{yes:{evidence:3,information:2},no:{evidence:-1}}]],
options:[['選択肢が二つしかないように見えてる？',{yes:{options:3,creative:2},no:{options:-1}}],['両方を少しずつ試す形にできる？',{yes:{experiment:3},no:{tradeoff:2}}],['逆のやり方を考えたことがある？',{yes:{creative:-1},no:{creative:2,options:1}}]],
decision:[['選ぶ基準はもう決まってる？',{yes:{decision:-2,action:2},no:{decision:3,priority:2}}],['一番避けたい失敗ははっきりしてる？',{yes:{risk:-1},no:{risk:2,decision:2}}],['決定を先延ばしにするコストがある？',{yes:{urgency:2,action:1},no:{urgency:-1}}]],
action:[['やること自体は、もう分かってる？',{yes:{action:2,clarity:-2},no:{clarity:2,options:1}}],['最初の15分でやることを言える？',{yes:{action:-1},no:{action:3,scope:1}}],['始めるための準備が足りない？',{yes:{friction:2,dependency:1},no:{friction:-1}}],['失敗より、始める瞬間が重い？',{yes:{friction:3},no:{fear:1}}]],
relation:[['相手との関係が悪くなるのが気になる？',{yes:{fear:2,communication:2},no:{fear:-1}}],['相手と目指しているものは同じ？',{yes:{alignment:-2,coordination:2},no:{alignment:3,conflict:2}}],['相手の得たいものを説明できる？',{yes:{stakeholder:-1},no:{stakeholder:3,information:1}}],['直接言わずに動かせる余地がある？',{yes:{experiment:2,communication:1},no:{communication:2,boundary:1}}],['約束より、仕組みを変えた方が効きそう？',{yes:{system:2,incentive:2},no:{communication:1}}],['今必要なのは説得より、線引き？',{yes:{boundary:3},no:{coordination:1}}]],
money:[['金額より、今後の余裕が読めないのが問題？',{yes:{uncertainty:2,money:2},no:{money:1}}],['失っても生活や予定に影響しない額？',{yes:{risk:-2},no:{risk:3,money:2}}],['将来の支出予定まで含めて考えた？',{yes:{money:-1},no:{money:3,dependency:1}}]],
time:[['期限は自分で決められる？',{yes:{control:1,urgency:-1},no:{urgency:2,dependency:1}}],['重要だけど急がないことが押し出されてる？',{yes:{priority:3,time:2},no:{priority:-1}}],['予定を減らす方が、効率化より先？',{yes:{scope:2,priority:2},no:{time:1}}]],
health:[['考える前に、休息や体調回復が必要？',{yes:{energy:3,emotion:1},no:{energy:-1}}],['今の判断力が普段より落ちてる感じがある？',{yes:{energy:2,risk:1},no:{energy:-1}}],['安全に関わる可能性がある？',{yes:{risk:4,urgency:2},no:{risk:-1}}]],
study:[['分からないより、手を動かす量が足りない？',{yes:{action:2,learning:1},no:{information:2,learning:2}}],['練習結果をすぐ確認できる？',{yes:{feedback:2},no:{feedback:3,experiment:1}}],['完璧に理解してから進もうとしてる？',{yes:{friction:2,experiment:2},no:{friction:-1}}]],
creative:[['評価する前に、案を増やす時間を取った？',{yes:{creative:-1},no:{creative:3,options:2}}],['完成品ではなく試作品を作れる？',{yes:{experiment:3,feedback:2},no:{scope:1}}],['他人に見せる前に整えすぎてる？',{yes:{friction:2,feedback:2},no:{friction:-1}}]],
system:[['同じ問題が何度も起きてる？',{yes:{repeat:3,system:2},no:{repeat:-1}}],['誰か一人ではなく、ルールが原因？',{yes:{system:4,incentive:2},no:{system:-1}}],['みんな合理的に動いてるのに悪い結果になる？',{yes:{incentive:4,system:3},no:{incentive:-1}}]],
risk:[['一度決めたら、元に戻しにくい？',{yes:{reversibility:4,risk:3},no:{reversibility:-2,experiment:1}}],['最悪の場合に耐えられる？',{yes:{risk:-1},no:{risk:4}}],['小さく試すことで損失を限定できる？',{yes:{experiment:3,risk:-1},no:{risk:1}}]]};
Object.entries(bank).forEach(([g,arr])=>arr.forEach(([t,w])=>add(g,t,labels[g]||'診断',w,g)));
const stems=[['いまの判断は、一度保留しても状況が悪化しない？',{yes:{urgency:-1,information:1},no:{urgency:2}}],['その問題は、自分の行動だけで少し改善できる？',{yes:{control:2,action:1},no:{dependency:2}}],['いま必要なのは、答えより先に一回試すこと？',{yes:{experiment:3,decision:-1},no:{information:1}}],['このまま進むと、同じ失敗を繰り返しそう？',{yes:{repeat:2,system:1},no:{repeat:-1}}],['考え続けるより、判断基準を一つ決める方が進みそう？',{yes:{priority:2,decision:2},no:{information:1}}],['誰かに頼ることで、状況が大きく変わりそう？',{yes:{dependency:1,coordination:2},no:{control:1}}],['問題を小さくすると、今日中に一歩進められそう？',{yes:{scope:-1,action:2},no:{scope:2}}],['結果を見ながら、途中で修正できる？',{yes:{feedback:2,reversibility:-1},no:{reversibility:2}}],['いま止まっているのは、選択肢不足より優先順位の問題？',{yes:{priority:3},no:{options:2}}],['相手や環境より、自分の決め方を変える方が早い？',{yes:{control:2,decision:1},no:{system:1}}]];
const contexts=['money','time','relation','study','career','health','emotion','creative','system','risk'];for(let i=0;i<240;i++){const [t,w]=stems[i%stems.length];const d=contexts[i%contexts.length];add(d,t,labels[d]||'診断',w,d)}
const results=[
{need:['experiment'],title:'まず、小さく試す',summary:'考え切ってから動くより、戻せる形で一度試した方が情報が増える状態です。',actions:[['試す範囲を半分以下にする','期限・金額・人数・時間のどれかを小さくする。'],['一回だけ実行する','継続を約束せず、反応を見るための一回にする。'],['見るポイントを一つ決める','成功か失敗かではなく、次の修正材料を集める。']],warn:'最初から完成形を作ろうとすると、判断も実行も重くなります。',methods:['デザイン思考','仮説検証','可逆的意思決定']},
{need:['clarity','scope'],title:'答えより先に、問題を小さくする',summary:'いまは解決策不足より、扱っている問題の範囲が広すぎる可能性があります。',actions:[['困っている現象を一つ選ぶ','原因や人物ではなく、観察できる出来事に絞る。'],['変えたいものを一つにする','全部を直さず、最初に変化させる一点を決める。'],['解決期限を仮置きする','永久解決ではなく、次の確認日までの目標にする。']],warn:'大きな問題名のまま考え続けると、何をしても不十分に見えます。',methods:['問題再定義','システム思考','デザイン思考']},
{need:['information','evidence'],title:'いまは決めず、事実を一つ取りに行く',summary:'重要な一点が推測のまま残っています。',actions:[['結論を変える情報を一つ決める','何が分かればYESとNOが入れ替わるか考える。'],['最短の取り方を選ぶ','検索、確認、観察、質問のうち一番早い方法を使う。'],['情報収集の終了条件を決める','全部分かるまで調べず、一つ取れたら再判断する。']],warn:'調べること自体が先延ばしになっていないかだけ確認します。',methods:['仮説検証','エビデンス思考','U理論']},
{need:['decision','priority','tradeoff'],title:'選択肢ではなく、選ぶ基準を決める',summary:'案が足りないのではなく、比較軸が定まっていないため結論が動いています。',actions:[['絶対条件を一つ決める','満たさない案はここで除外する。'],['重視する順番を三つまで決める','全部を同じ重さで比べない。'],['同点なら戻しやすい方を選ぶ','結果が近いなら、後から修正できる方を優先する。']],warn:'基準を増やしすぎると決まりません。',methods:['多基準意思決定','機会費用','可逆性']},
{need:['action','friction'],title:'考える工程を減らして、最初の15分だけ動く',summary:'やることは見えていて、問題は選択ではなく開始時の摩擦にあります。',actions:[['準備を一つだけ残す','開始前に必要な作業を最小限にする。'],['15分で終わる単位に切る','成果ではなく開始を完了条件にする。'],['次にやる時刻を決める','気分ではなく予定に接続する。']],warn:'やる気が出るまで待つ方法は再現性が低いです。',methods:['実行意図','行動設計','習慣化']},
{need:['communication','fear','coordination'],title:'正面衝突せず、小さな変更から',summary:'関係そのものより、やり取りが気まずくなる瞬間が行動を止めています。',actions:[['自分の動きを少し変える','頻度、時間、距離、参加方法のどれかを調整する。'],['仕組みで伝える','予定、ルール、役割分担など個人攻撃に見えない形にする。'],['反応を見て次を決める','一度で結論を出さず、小さい変化への反応を確認する。']],warn:'相手の気持ちを細かく予想し続けても気まずさは減りません。',methods:['ゲーム理論','小さな実験','非対立的調整']},
{need:['boundary','conflict'],title:'説得より、線を引く',summary:'相手を変えることより、自分が受け入れる範囲を決める方が早い状態です。',actions:[['受け入れられない条件を一つ決める','理由を増やさず境界だけ明確にする。'],['代替案を一つ添える','拒否だけで終わらず可能な範囲を示す。'],['反応ではなく運用を見る','相手が納得するかより境界が守られるかを見る。']],warn:'説明を増やしすぎると境界線が交渉材料になります。',methods:['境界線設計','交渉論','ゲーム理論']},
{need:['system','repeat','incentive'],title:'人ではなく、繰り返す仕組みを直す',summary:'誰かの性格より、同じ結果を生むルールや報酬構造に原因がありそうです。',actions:[['問題が起きる直前の流れを書く','人名ではなく手順と条件を見る。'],['得をする行動を確認する','望ましくない行動が合理的になる理由を探す。'],['一つのルールを変えて試す','全体改革ではなく再発ポイント一つを変える。']],warn:'個人への注意だけでは構造が同じなら再発します。',methods:['システム思考','ゲーム理論','インセンティブ設計']},
{need:['risk','reversibility','uncertainty'],title:'決める前に、失敗の上限を作る',summary:'成功確率より、失敗した時に戻れないことが判断を重くしています。',actions:[['失える上限を決める','金額、時間、信用、健康のどこまでなら耐えられるか決める。'],['段階を分ける','一括で決めず確認点を入れる。'],['中止条件を先に決める','悪化してから悩まず撤退基準を置く。']],warn:'期待利益だけで不可逆な判断を正当化しないようにします。',methods:['リスク管理','リアルオプション','プレモータム']},
{need:['energy','emotion'],title:'結論を出す前に、判断できる状態へ戻す',summary:'問題そのものより、今の疲労や感情負荷が判断を歪める可能性があります。',actions:[['決定を一度保留する','緊急でない限り判断の質が戻るまで待つ。'],['負荷を一つ減らす','睡眠、予定、情報、人との接触のどれかを減らす。'],['次の確認時刻を決める','無期限に逃げず再判断する日時を置く。']],warn:'強い疲労や感情の最中に取り返しのつかない判断をしないようにします。',methods:['U理論','認知負荷管理','意思決定衛生']},
{need:['learning','feedback'],title:'理解より、短い練習と即確認を回す',summary:'知識不足だけでなく、試した結果が返ってくる速度が遅い状態です。',actions:[['一問・一操作まで小さくする','長い学習単位をやめる。'],['すぐ答え合わせする','間違いを溜めずその場で原因を分類する。'],['次の一回だけ修正する','全体計画より直近の失敗を一つ改善する。']],warn:'理解してから練習するのではなく練習で理解を作ります。',methods:['フィードバック学習','意図的練習','反復改善']},
{need:['creative','options'],title:'評価を止めて、案を増やす',summary:'良い案がないというより、案を出す段階で評価が入りすぎています。',actions:[['10分だけ量を出す','良し悪しを決めず数を優先する。'],['制約を一つ置く','時間、予算、形式のどれかを固定する。'],['一番雑な案を試作する','完成度ではなく反応を見るために形にする。']],warn:'最初の案を完成させようとすると発想の幅が狭くなります。',methods:['デザイン思考','発散と収束','プロトタイピング']}
];
const state={setup:{},scores:{},asked:[],answers:{},lastGroups:[],questionNo:0,maxQuestions:7};vars.forEach(v=>state.scores[v]=0);const $=id=>document.getElementById(id);
function renderSetup(){const root=$('setupGroups');root.innerHTML=setupConfig.map(g=>`<div class="group" data-group="${g.id}"><h3>${g.title}</h3><div class="choice-grid">${g.options.map(([v,l])=>`<button class="choice" data-value="${v}">${l}</button>`).join('')}</div></div>`).join('');document.querySelectorAll('.group').forEach(group=>{const cfg=setupConfig.find(x=>x.id===group.dataset.group);group.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(cfg.multi){btn.classList.toggle('selected');let a=[...group.querySelectorAll('.choice.selected')].map(x=>x.dataset.value);if(cfg.max&&a.length>cfg.max){btn.classList.remove('selected');a=a.filter(x=>x!==btn.dataset.value)}state.setup[cfg.id]=a}else{group.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');state.setup[cfg.id]=btn.dataset.value}validate()})})}
function validate(){$('startBtn').disabled=!setupConfig.every(g=>g.multi?(state.setup[g.id]||[]).length:state.setup[g.id])}
function bump(k,n){state.scores[k]=(state.scores[k]||0)+n}function seed(){const s=state.setup;if(s.stage.includes('unclear')){bump('clarity',4);bump('scope',2)}if(s.stage.includes('cause'))bump('clarity',2);if(s.stage.includes('info')){bump('information',4);bump('evidence',2)}if(s.stage.includes('ideas')){bump('options',4);bump('creative',2)}if(s.stage.includes('choice')){bump('decision',4);bump('priority',2)}if(s.stage.includes('agreement')){bump('conflict',3);bump('coordination',3)}if(s.stage.includes('action')){bump('action',4);bump('friction',2)}if(s.stage.includes('stuck')){bump('feedback',3);bump('system',2)}if(s.stage.includes('repeat')){bump('repeat',4);bump('system',3)}if(s.stage.includes('emotion')){bump('emotion',4);bump('energy',1)}s.domains.forEach(d=>bump(d,3));if(['one','group','org'].includes(s.people)){bump('stakeholder',2);bump('communication',2)}if(s.control==='high')bump('control',2);if(['low','authority'].includes(s.control)){bump('dependency',2);bump('permission',2)}if(s.reversibility==='unknown')bump('uncertainty',2);if(s.reversibility==='hard')bump('risk',3);if(s.reversibility==='irreversible'){bump('risk',5);bump('reversibility',5)}if(s.time==='today')bump('urgency',4);if(s.time==='unknown')bump('uncertainty',2);if(s.mindset.includes('fear'))bump('fear',3);if(s.mindset.includes('avoid'))bump('friction',2)}
function applicable(q){if(state.asked.includes(q.id))return false;if(q.domain&&['money','time','relation','study','health','creative','system','risk'].includes(q.domain)&&!state.setup.domains.includes(q.domain))return false;if(q.group==='relation'&&!['one','group','org','public'].includes(state.setup.people))return false;return true}
function qscore(q){let n=0;Object.values(q.w).forEach(a=>Object.entries(a).forEach(([k,v])=>n+=Math.max(0,state.scores[k]||0)*Math.abs(v)));if(state.lastGroups.includes(q.group))n-=35;if(q.group==='action'&&state.setup.stage.includes('action'))n+=10;if(q.group==='relation'&&state.setup.domains.includes('relation'))n+=8;return n+Math.random()*2}
function pick(){return Q.filter(applicable).sort((a,b)=>qscore(b)-qscore(a))[0]}
function showQuestion(){const q=pick();if(!q)return showResult();state.current=q;$('questionKicker').textContent=q.kicker;$('questionText').textContent=q.text;$('questionCount').textContent=`${state.questionNo+1}問目くらい`;$('branchHint').textContent=state.questionNo<3?'入口を絞っています':'結果が変わる質問だけ';$('progressBar').style.width=`${Math.min(92,18+(state.questionNo/state.maxQuestions)*72)}%`;show('questionScreen')}
function answer(a){const q=state.current;state.asked.push(q.id);state.answers[q.id]=a;state.questionNo++;Object.entries(q.w[a]||{}).forEach(([k,v])=>bump(k,v));state.lastGroups=[...state.lastGroups.slice(-1),q.group];state.questionNo>=state.maxQuestions?showResult():showQuestion()}
function chooseResult(){return results.map(r=>[r,r.need.reduce((s,k)=>s+(state.scores[k]||0),0)]).sort((a,b)=>b[1]-a[1])[0][0]}
function showResult(){const r=chooseResult();const tops=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>0).slice(0,6);const max=Math.max(1,...tops.map(x=>x[1]));$('resultContent').innerHTML=`<div class="result-layout"><div class="result-main"><div class="result-label">NEXT MOVE</div><h2>${r.title}</h2><p>${r.summary}</p><div class="action-list">${r.actions.map((a,i)=>`<div class="action-item"><b>${i+1}</b><div><strong>${a[0]}</strong><span>${a[1]}</span></div></div>`).join('')}</div></div><aside class="result-side"><div class="side-block"><h3>裏で使った考え方</h3><div class="tag-wrap">${r.methods.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div><div class="side-block"><h3>今は避けること</h3><div class="warning">${r.warn}</div></div><div class="side-block"><h3>強く出た要素</h3><div class="score-list">${tops.map(([k,v])=>`<div class="score-row"><span>${labels[k]||k}</span><div class="score-bar"><span style="width:${Math.max(10,v/max*100)}%"></span></div><b>${v}</b></div>`).join('')}</div></div><div class="history">${state.questionNo}問で仮結論。自由文は診断に使用していません。質問バンク ${Q.length}件。</div></aside></div>`;show('resultScreen')}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}function reset(){state.setup={};state.scores={};vars.forEach(v=>state.scores[v]=0);state.asked=[];state.answers={};state.lastGroups=[];state.questionNo=0;state.maxQuestions=7;renderSetup();show('setupScreen')}
$('startBtn').onclick=()=>{seed();showQuestion()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.answer));$('moreBtn').onclick=()=>{state.maxQuestions=state.questionNo+4;showQuestion()};$('restartBtn').onclick=reset;renderSetup();
</script></body></html>
