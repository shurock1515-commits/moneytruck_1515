;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.045);font-weight:850;font-size:1rem}.answer:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}.question-meta{display:flex;justify-content:center;gap:14px;margin-top:18px;color:var(--muted);font-size:.72rem}.result-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.result-main,.result-side{padding:22px;border-radius:22px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.result-label{color:var(--mint);font-size:.72rem;font-weight:850;letter-spacing:.13em}.result-main h2{font-size:clamp(1.8rem,4vw,3.3rem);margin:8px 0 12px;letter-spacing:-.05em}.result-main>p{color:#d7e1ef;line-height:1.8}.action-list{display:grid;gap:10px;margin-top:20px}.action-item{display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:start;padding:13px;border-radius:16px;background:rgba(255,255,255,.045)}.action-item b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#07131f;background:linear-gradient(145deg,var(--blue),var(--mint))}.action-item strong{display:block;margin-bottom:4px}.action-item span{color:var(--muted);font-size:.8rem;line-height:1.55}.side-block{margin-bottom:18px}.side-block h3{font-size:.83rem;margin:0 0 9px;color:var(--muted)}.tag-wrap{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:7px 10px;border-radius:999px;background:rgba(116,169,255,.11);color:#cfe1ff;font-size:.72rem}.warning{padding:13px 14px;border-radius:15px;background:rgba(255,179,108,.09);border-left:4px solid var(--orange);line-height:1.6;font-size:.8rem}.score-list{display:grid;gap:8px}.score-row{display:grid;grid-template-columns:110px 1fr 32px;gap:8px;align-items:center;font-size:.72rem;color:var(--muted)}.score-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.score-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue))}.history{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:.72rem}@media(max-width:760px){.hero{display:block}.hero p{text-align:left}.result-layout{grid-template-columns:1fr}.question-wrap{padding:18px 8px}.answer{min-width:120px;flex:1}.home span{display:none}.shell{padding-top:74px}}

<body><a class="home" href="index.html"><i></i><span>HOME</span></a><main class="shell"><header class="hero"><div><div class="eyebrow">Adaptive problem solving</div><h1>Decision Lab</h1></div><p>問題文を読まずに、状況と答え方から「次に何をするか」を組み立てる。質問は一問ずつ、必要なものだけ。</p></header><section class="panel">
<div id="setupScreen" class="screen active inner"><div class="step-title"><div><h2>最初に、問題の地形だけ教えて</h2><p>文章は使わない。選択肢だけで質問の入口を決めます。</p></div><span class="badge">STEP 1</span></div><div id="setupGroups"></div><div class="footer-actions"><button id="startBtn" class="primary" disabled>診断をはじめる</button></div></div>
<div id="questionScreen" class="screen"><div class="question-wrap"><div class="question-card"><div class="question-toolbar"><button id="backQuestion" class="back-question" type="button">← 1問戻る</button></div><div class="progress-line"><span id="progressBar"></span></div><div id="questionKicker" class="question-kicker"></div><div id="questionText" class="question"></div><div class="answer-row"><button class="answer" data-answer="yes">YES</button><button class="answer" data-answer="no">NO</button><button class="answer" data-answer="unknown">わからない</button><button class="answer" data-answer="na">該当しない</button></div><div class="question-meta"><span id="questionCount"></span><span id="branchHint"></span></div></div></div></div>
<div id="resultScreen" class="screen inner"><div class="step-title"><div><h2>いまの仮結論</h2><p>必要なら、追加質問で精度を上げられます。</p></div><span class="badge">RESULT</span></div><div id="resultContent"></div><div class="footer-actions"><button id="backFromResult" class="ghost">← 前の質問へ</button><button id="moreBtn" class="ghost">もう少し絞る</button><button id="restartBtn" class="primary">最初から</button></div></div>
</section></main>
<script>
const setupConfig=[
{id:'time',title:'いつまでに動く？',multi:false,options:[['today','今日〜3日'],['week','1週間くらい'],['month','1か月くらい'],['long','数か月以上'],['unknown','まだ分からない']]},
{id:'people',title:'誰が関わる？',multi:false,options:[['self','自分だけ'],['one','特定の相手1人'],['group','少人数'],['org','学校・会社・組織'],['public','不特定多数']]},
{id:'domains',title:'何が絡む？',multi:true,options:[['money','お金'],['time','時間'],['relation','人間関係'],['study','学業・能力'],['career','仕事・進路'],['health','健康・体力'],['emotion','感情'],['creative','創作'],['system','ルール・制度'],['risk','安全・リスク']]},
{id:'stage',title:'どこで止まってる？',multi:true,max:2,options:[['unclear','問題がぼんやり'],['cause','原因が分からない'],['info','情報不足'],['ideas','案がない'],['choice','選べない'],['agreement','合意できない'],['action','動けない'],['stuck','動いても進まない'],['repeat','繰り返している'],['emotion','感情が強い']]},
{id:'control',title:'自分で動かせる範囲は？',multi:false,options:[['high','ほぼ自分で動かせる'],['medium','相手の協力が少し必要'],['joint','合意が必要'],['authority','許可が必要'],['low','環境次第'],['unknown','分からない']]},
{id:'reversibility',title:'失敗したら戻せる？',multi:false,options:[['easy','すぐ戻せる'],['some','少し損するが戻せる'],['hard','かなり損する'],['irreversible','ほぼ戻せない'],['unknown','分からない']]},
{id:'mindset',title:'今の気分は？',multi:true,max:2,options:[['fast','早く決めたい'],['careful','慎重に進めたい'],['confirm','考えを確認したい'],['fear','失敗が怖い'],['avoid','避けている'],['logic','合理的に考えたい'],['values','納得感もほしい']]}
];
const vars=['clarity','information','options','decision','action','friction','fear','reversibility','urgency','conflict','trust','coordination','boundary','incentive','control','system','habit','energy','emotion','money','time','risk','learning','creative','stakeholder','feedback','experiment','uncertainty','repeat','alignment','communication','evidence','priority','scope','dependency','permission','tradeoff','overthinking','avoidance','rigidity','shortterm','ownership','measurement','sequencing','maintenance','socialguess','resourcegap','followthrough','adaptability','selfinterest','fairness'];
const labels={clarity:'問題の輪郭',information:'情報不足',options:'選択肢',decision:'意思決定',action:'行動',friction:'摩擦',fear:'不安',reversibility:'戻しやすさ',urgency:'緊急度',conflict:'利害衝突',trust:'信頼',coordination:'調整',boundary:'境界線',incentive:'動機設計',control:'制御可能性',system:'構造',habit:'習慣',energy:'実行エネルギー',emotion:'感情負荷',money:'金銭',time:'時間',risk:'リスク',learning:'学習',creative:'発想',stakeholder:'関係者',feedback:'検証',experiment:'小さな実験',uncertainty:'不確実性',repeat:'再発',alignment:'方向一致',communication:'伝え方',evidence:'根拠',priority:'優先順位',scope:'問題範囲',dependency:'依存関係',permission:'許可',tradeoff:'トレードオフ',overthinking:'考えすぎ',avoidance:'回避傾向',rigidity:'固定化',shortterm:'短期偏重',ownership:'当事者意識',measurement:'測定',sequencing:'順序設計',maintenance:'維持設計',socialguess:'相手の推測',resourcegap:'資源不足',followthrough:'継続力',adaptability:'修正力',selfinterest:'自分の利害',fairness:'公平感'};
const Q=[];let qn=0;const normalizeText=s=>String(s).replace(/[？?！!、。・\s]/g,'').toLowerCase();const add=(group,text,kicker,w,domain=null,stage=group,tags=[])=>Q.push({id:'q'+(++qn),group,text,kicker,w,domain,stage,tags,textKey:normalizeText(text)});
const bank={
clarity:[['解決したい状態は、頭の中ではっきりしてる？',{yes:{clarity:-2,action:1},no:{clarity:3,scope:2},unknown:{clarity:2}}],['問題を小さく一つに切れそう？',{yes:{scope:-2,action:1},no:{scope:3,clarity:1}}],['本当は別の問題が奥にある感じがする？',{yes:{clarity:3},no:{clarity:-1}}]],
information:[['決めるために足りない事実がある？',{yes:{information:3,evidence:2},no:{information:-2,decision:1}}],['誰かに一度聞けば分かることが残ってる？',{yes:{information:2,communication:1},no:{information:-1}}],['推測を事実として扱ってる部分がある？',{yes:{evidence:3,information:2},no:{evidence:-1}}]],
options:[['選択肢が二つしかないように見えてる？',{yes:{options:3,creative:2},no:{options:-1}}],['両方を少しずつ試す形にできる？',{yes:{experiment:3},no:{tradeoff:2}}],['逆のやり方を考えたことがある？',{yes:{creative:-1},no:{creative:2,options:1}}]],
decision:[['選ぶ基準はもう決まってる？',{yes:{decision:-2,action:2},no:{decision:3,priority:2}}],['一番避けたい失敗ははっきりしてる？',{yes:{risk:-1},no:{risk:2,decision:2}}],['決定を先延ばしにするコストがある？',{yes:{urgency:2,action:1},no:{urgency:-1}}]],
action:[['やること自体は、もう分かってる？',{yes:{action:2,clarity:-2},no:{clarity:2,options:1}}],['最初の15分でやることを言える？',{yes:{action:-1},no:{action:3,scope:1}}],['始めるための準備が足りない？',{yes:{friction:2,dependency:1},no:{friction:-1}}],['失敗より、始める瞬間が重い？',{yes:{friction:3},no:{fear:1}}]],
relation:[['相手との関係が悪くなるのが気になる？',{yes:{fear:2,communication:2},no:{fear:-1}}],['相手と目指しているものは同じ？',{yes:{alignment:-2,coordination:2},no:{alignment:3,conflict:2}}],['相手の得たいものを説明できる？',{yes:{stakeholder:-1},no:{stakeholder:3,information:1}}],['直接言わずに動かせる余地がある？',{yes:{experiment:2,communication:1},no:{communication:2,boundary:1}}],['約束より、仕組みを変えた方が効きそう？',{yes:{system:2,incentive:2},no:{communication:1}}],['今必要なのは説得より、線引き？',{yes:{boundary:3},no:{coordination:1}}]],
money:[['金額より、今後の余裕が読めないのが問題？',{yes:{uncertainty:2,money:2},no:{money:1}}],['失っても生活や予定に影響しない額？',{yes:{risk:-2},no:{risk:3,money:2}}],['将来の支出予定まで含めて考えた？',{yes:{money:-1},no:{money:3,dependency:1}}]],
time:[['期限は自分で決められる？',{yes:{control:1,urgency:-1},no:{urgency:2,dependency:1}}],['重要だけど急がないことが押し出されてる？',{yes:{priority:3,time:2},no:{priority:-1}}],['予定を減らす方が、効率化より先？',{yes:{scope:2,priority:2},no:{time:1}}]],
health:[['考える前に、休息や体調回復が必要？',{yes:{energy:3,emotion:1},no:{energy:-1}}],['今の判断力が普段より落ちてる感じがある？',{yes:{energy:2,risk:1},no:{energy:-1}}],['安全に関わる可能性がある？',{yes:{risk:4,urgency:2},no:{risk:-1}}]],
study:[['分からないより、手を動かす量が足りない？',{yes:{action:2,learning:1},no:{information:2,learning:2}}],['練習結果をすぐ確認できる？',{yes:{feedback:2},no:{feedback:3,experiment:1}}],['完璧に理解してから進もうとしてる？',{yes:{friction:2,experiment:2},no:{friction:-1}}]],
creative:[['評価する前に、案を増やす時間を取った？',{yes:{creative:-1},no:{creative:3,options:2}}],['完成品ではなく試作品を作れる？',{yes:{experiment:3,feedback:2},no:{scope:1}}],['他人に見せる前に整えすぎてる？',{yes:{friction:2,feedback:2},no:{friction:-1}}]],
system:[['同じ問題が何度も起きてる？',{yes:{repeat:3,system:2},no:{repeat:-1}}],['誰か一人ではなく、ルールが原因？',{yes:{system:4,incentive:2},no:{system:-1}}],['みんな合理的に動いてるのに悪い結果になる？',{yes:{incentive:4,system:3},no:{incentive:-1}}]],
risk:[['一度決めたら、元に戻しにくい？',{yes:{reversibility:4,risk:3},no:{reversibility:-2,experiment:1}}],['最悪の場合に耐えられる？',{yes:{risk:-1},no:{risk:4}}],['小さく試すことで損失を限定できる？',{yes:{experiment:3,risk:-1},no:{risk:1}}]]};
Object.entries(bank).forEach(([g,arr])=>arr.forEach(([t,w])=>add(g,t,labels[g]||'診断',w,g)));
const concrete=[
['action','今日このあと実際に手を付ける時間を決めてある？','行動',{yes:{followthrough:-1,action:-1},no:{followthrough:3,friction:2}},null],
['action','必要な道具や連絡先を、今すぐ取り出せる？','行動',{yes:{resourcegap:-1},no:{resourcegap:3,friction:2}},null],
['action','最初の一歩が30分以上かかる形になってる？','行動',{yes:{scope:2,friction:2},no:{scope:-1}},null],
['action','一度始めても、次に何をするか迷いそう？','行動',{yes:{sequencing:3,followthrough:2},no:{sequencing:-1}},null],
['action','始めるより、途中で止まる方がいつもの問題？','行動',{yes:{maintenance:3,followthrough:3},no:{friction:1}},null],
['decision','選んだあとに「別の方がよかった」と何度も見直しそう？','決め方',{yes:{overthinking:3,commitment:2},no:{overthinking:-1}},null],
['decision','一番大事な条件より、目先の楽さを優先しそう？','決め方',{yes:{shortterm:3,priority:2},no:{shortterm:-1}},null],
['decision','誰かに決めてもらえたら楽だと思う？','決め方',{yes:{ownership:3,avoidance:2},no:{ownership:-1}},null],
['information','数字や事実を一つ取れば、かなり判断が変わる？','情報',{yes:{measurement:3,information:2},no:{measurement:-1}},null],
['information','確認できるのに、相手の気持ちを想像だけで補ってる？','情報',{yes:{socialguess:4,evidence:2},no:{socialguess:-1}},'relation'],
['information','情報を集めるほど、決めるのが遅くなってる？','情報',{yes:{overthinking:4,information:-1},no:{overthinking:-1}},null],
['relation','自分の望みを、相手に合わせて小さくしすぎてる？','人との間',{yes:{selfinterest:3,boundary:2},no:{selfinterest:-1}},'relation'],
['relation','相手に公平であることと、自分が我慢することを同じにしてる？','人との間',{yes:{fairness:3,boundary:2},no:{fairness:-1}},'relation'],
['relation','相手の反応を確かめる前に、悪い展開を決めつけてる？','人との間',{yes:{socialguess:4,fear:2},no:{socialguess:-1}},'relation'],
['relation','言う内容より、言った後の沈黙が嫌？','人との間',{yes:{communication:2,avoidance:2},no:{communication:-1}},'relation'],
['relation','相手に変わってほしいが、自分のやり方は変えたくない？','人との間',{yes:{rigidity:4,control:1},no:{adaptability:1}},'relation'],
['relation','一度の話し合いで全部解決しようとしてる？','人との間',{yes:{scope:2,overthinking:1},no:{experiment:1}},'relation'],
['money','支払った直後より、翌月以降の負担が問題になりそう？','お金',{yes:{maintenance:3,money:2},no:{maintenance:-1}},'money'],
['money','その支出をした後も、予定している出費を全部払える？','お金',{yes:{risk:-2},no:{risk:4,resourcegap:2}},'money'],
['money','金額が小さいから、頻度を無視してる？','お金',{yes:{repeat:3,shortterm:2},no:{repeat:-1}},'money'],

  let gain=0;
  keys.forEach(k=>{
    const vals=branches.map(b=>b[k]||0);
    gain+=Math.max(...vals)-Math.min(...vals);
    if(Math.abs(state.scores[k]||0)<2)gain+=1.2;
  });
  return gain;
}
function semanticPenalty(q){
  let p=0;
  if(state.lastGroups.slice(-2).includes(q.group))p+=32;
  if(state.lastStages.slice(-2).includes(q.stage))p+=24;
  if(q.tags?.some(tag=>state.lastTags.slice(-5).includes(tag)))p+=28;
  return p;
}
function qscore(q){
  let n=informationGain(q)*5;
  Object.values(q.w).forEach(a=>Object.entries(a).forEach(([k,v])=>n+=Math.max(0,state.scores[k]||0)*Math.abs(v)*.7));
  n-=semanticPenalty(q);
  if(q.group==='action'&&state.setup.stage.includes('action'))n+=10;
  if(q.group==='relation'&&state.setup.domains.includes('relation'))n+=8;
  if(q.group==='information'&&state.setup.stage.includes('info'))n+=8;
  if(q.group==='decision'&&state.setup.stage.includes('choice'))n+=8;
  if(q.group==='system'&&state.setup.stage.includes('repeat'))n+=8;
  return n+Math.random()*1.5
}
function pick(){
  const pool=Q.filter(applicable);
  pool.sort((a,b)=>qscore(b)-qscore(a));
  return pool[0]
}
function makeSnapshot(){
  return {
    scores:{...state.scores},
    asked:[...state.asked],
    askedTexts:[...state.askedTexts],
    answers:{...state.answers},
    lastGroups:[...state.lastGroups],
    lastStages:[...state.lastStages],
    lastTags:[...state.lastTags],
    questionNo:state.questionNo,
    currentId:state.current?.id||null
  };
}
function restoreSnapshot(snapshot){
  state.scores={...snapshot.scores};
  state.asked=[...snapshot.asked];
  state.askedTexts=new Set(snapshot.askedTexts);
  state.answers={...snapshot.answers};
  state.lastGroups=[...snapshot.lastGroups];
  state.lastStages=[...snapshot.lastStages];
  state.lastTags=[...snapshot.lastTags];
  state.questionNo=snapshot.questionNo;
  state.current=Q.find(q=>q.id===snapshot.currentId)||null;
}
function updateBackButton(){
  const button=$('backQuestion');
  if(button)button.disabled=state.history.length===0;
}
function goBackQuestion(){
  const snapshot=state.history.pop();
  if(!snapshot)return;
  restoreSnapshot(snapshot);
  if(state.current){
    $('questionKicker').textContent=state.current.kicker;
    $('questionText').textContent=state.current.text;
    $('questionCount').textContent=`${state.questionNo+1}問目くらい`;
    $('branchHint').textContent=state.questionNo<4?'問題の地形を確認中':'前の答えから分岐中';
    $('progressBar').style.width=`${Math.min(94,12+(state.questionNo/state.maxQuestions)*82)}%`;
    show('questionScreen');
    updateBackButton();
  }else{
    showQuestion();
  }
}
function showQuestion(){const q=pick();if(!q)return showResult();state.current=q;$('questionKicker').textContent=q.kicker;$('questionText').textContent=q.text;$('questionCount').textContent=`${state.questionNo+1}問目くらい`;$('branchHint').textContent=state.questionNo<4?'問題の地形を確認中':'前の答えから分岐中';$('progressBar').style.width=`${Math.min(94,12+(state.questionNo/state.maxQuestions)*82)}%`;show('questionScreen');updateBackButton()}
function answer(a){
  const q=state.current;
  state.history.push(makeSnapshot());
  state.asked.push(q.id);state.askedTexts.add(q.textKey);state.answers[q.id]=a;state.questionNo++;
  Object.entries(q.w[a]||{}).forEach(([k,v])=>bump(k,v));
  state.lastGroups=[...state.lastGroups.slice(-2),q.group];
  state.lastStages=[...state.lastStages.slice(-2),q.stage];
  state.lastTags=[...state.lastTags.slice(-5),...(q.tags||[])];
  state.questionNo>=state.maxQuestions?showResult():showQuestion()
}
function chooseResult(){return results.map(r=>[r,r.need.reduce((s,k)=>s+(state.scores[k]||0),0)]).sort((a,b)=>b[1]-a[1])[0][0]}
function scoreOf(k){return state.scores[k]||0}
function topEntries(limit=8){return Object.entries(state.scores).sort((a,b)=>b[1]-a[1]).slice(0,limit)}
function lowRelevant(){
  const relevant=['feedback','measurement','maintenance','adaptability','ownership','followthrough','evidence','priority','experiment','communication'];
  return relevant.map(k=>[k,scoreOf(k)]).sort((a,b)=>a[1]-b[1]).slice(0,3)
}
function languageSummary(){
  const high=topEntries(5).map(([k])=>labels[k]);
  const parts=[];
  if(scoreOf('clarity')>3&&scoreOf('action')>2)parts.push('やることは見えているのに、問題の切り方が大きくて動き出しにくい');
  else if(scoreOf('action')>4&&scoreOf('friction')>2)parts.push('答え不足ではなく、始める瞬間と続ける仕組みで止まりやすい');
  else if(scoreOf('information')>4)parts.push('判断そのものより、まだ事実と推測が混ざっている');
  else if(scoreOf('decision')>4)parts.push('選択肢より、何を優先して選ぶかが定まっていない');
  else if(scoreOf('communication')>3)parts.push('内容より、伝えた後の空気や反応を気にして動きにくい');
  else parts.push(`${high.slice(0,2).join('と')}が中心になっている`);
  if(scoreOf('overthinking')>3)parts.push('考えるほど精度が上がる段階を越えて、判断が重くなり始めている');
  if(scoreOf('avoidance')>3)parts.push('失敗回避が、必要な確認や実験まで避ける方向に働いている');
  return parts.join('。')+'。';
}
function dangerInsight(){
  const candidates=[
    ['overthinking','考え続ければ安全になると思い、実際には判断材料が増えていないのに結論を遅らせやすいです。'],
    ['socialguess','相手へ確認する前に反応を予測し、その予測に合わせて自分の選択肢を狭めやすいです。'],
    ['shortterm','目先の負担を減らす選択が、後の維持費・再発・締切負担を増やしやすいです。'],
    ['rigidity','最初に決めた案や計画を守ることが目的になり、途中で修正すべきサインを無視しやすいです。'],
    ['avoidance','失敗を避けるための慎重さが、必要な確認や小さな行動まで止めやすいです。'],
    ['fear','悪い結果の可能性を大きく見積もり、戻せる小さな選択まで重く扱いやすいです。'],
    ['system','目の前の人や出来事だけを直して、同じ問題を生む仕組みを残しやすいです。']
  ].sort((a,b)=>scoreOf(b[0])-scoreOf(a[0]));
  return candidates[0];
}
function missingInsight(){
  const map={
    feedback:'行動後の確認が弱いので、実行できても「効いたか分からない」状態になりやすいです。次の段階では確認指標が必要です。',
    measurement:'感覚で改善を判断しやすいため、後から同じ迷いが戻る可能性があります。小さな数値か観察項目を一つ置く必要があります。',
    maintenance:'始め方は考えられても、続け方や再発防止が薄いです。最初の一歩の後に、維持方法を追加する必要があります。',
    adaptability:'計画変更の余地が少ないと、最初の案が外れた時に全停止しやすくなります。途中修正を前提にした方が安全です。',
    ownership:'誰が最後に動くかが曖昧になりやすいです。後で責任の所在を一人に決める必要があります。',
    followthrough:'開始後の次の一手が弱く、単発で終わる可能性があります。二回目の行動を先に予約しておく必要があります。',
    evidence:'推測と事実の区別が弱いままだと、結論に自信が出ません。後で一つだけ確認可能な根拠を足す必要があります。',
    priority:'重要なものを同列に扱うと、実行段階で再び迷います。後で捨てる条件を決める必要があります。',
    experiment:'一度で正解を当てる形になりやすいです。後で小さく試せる部分を作る必要があります。',
    communication:'自分の中で整理できても、他者が関わる段階で詰まりやすいです。後で短く共有する形が必要です。'
  };
  const chosen=lowRelevant().find(([k])=>map[k])||['feedback',0];
  return [chosen[0],map[chosen[0]]];
}
function secondaryDirection(primary){
  const ranked=results.map(r=>[r,r.need.reduce((s,k)=>s+scoreOf(k),0)]).sort((a,b)=>b[1]-a[1]);
  return ranked.find(([r])=>r.title!==primary.title)?.[0]||primary;
}
function showResult(){
  const r=chooseResult(),secondary=secondaryDirection(r),tops=topEntries(7).filter(x=>x[1]>0);
  const max=Math.max(1,...tops.map(x=>x[1]));
  const danger=dangerInsight(),missing=missingInsight();
  $('resultContent').innerHTML=`<div class="result-layout"><div class="result-main">
    <div class="result-label">YOUR PROBLEM, IN WORDS</div>
    <div class="language-box"><span>いま起きていること</span><strong>${languageSummary()}</strong></div>
    <div class="result-label">NEXT MOVE</div><h2>${r.title}</h2><p>${r.summary}</p>
    <div class="action-list">${r.actions.map((a,i)=>`<div class="action-item"><b>${i+1}</b><div><strong>${a[0]}</strong><span>${a[1]}</span></div></div>`).join('')}</div>
    <div class="result-insights">
      <div class="insight-card danger"><h3>このままだと走りやすい間違い</h3><p>${danger[1]}</p></div>
      <div class="insight-card growth"><h3>低く出た要素から見る、次の弱点</h3><p>${missing[1]}</p></div>
      <div class="insight-card later"><h3>今すぐではないが、後で必要になる方向</h3><p>まず「${r.title}」を優先し、その後に「${secondary.title}」へ進むと、応急処置だけで終わりにくくなります。</p></div>
    </div>
  </div><aside class="result-side">
    <div class="side-block"><h3>裏で使った考え方</h3><div class="tag-wrap">${r.methods.map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>
    <div class="side-block"><h3>今は避けること</h3><div class="warning">${r.warn}</div></div>
    <div class="side-block"><h3>診断で強く出た要素</h3><div class="score-list">${tops.map(([k,v])=>`<div class="score-row"><span>${labels[k]||k}</span><div class="score-bar"><span style="width:${Math.max(10,v/max*100)}%"></span></div><b>${v}</b></div>`).join('')}</div></div>
    <div class="side-block"><h3>次の確認ポイント</h3><div class="secondary-actions">
      <div class="secondary-action">実行後に、何が変わったか一つだけ記録する。</div>
      <div class="secondary-action">結果が悪ければ、失敗ではなく質問の前提を一つ修正する。</div>
    </div></div>
    <div class="history">${state.questionNo}問で仮結論。自由文は診断に使用していません。質問バンク ${Q.length}件、内部変数 ${vars.length}個。</div>
  </aside></div>`;show('resultScreen')
}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}function reset(){state.setup={};state.scores={};vars.forEach(v=>state.scores[v]=0);state.asked=[];state.askedTexts=new Set();state.answers={};state.lastGroups=[];state.lastStages=[];state.lastTags=[];state.history=[];state.questionNo=0;state.maxQuestions=20;renderSetup();show('setupScreen')}
$('startBtn').onclick=()=>{seed();state.history=[];showQuestion()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.answer));$('backQuestion').onclick=goBackQuestion;$('backFromResult').onclick=goBackQuestion;$('moreBtn').onclick=()=>{state.maxQuestions=state.questionNo+8;showQuestion()};$('restartBtn').onclick=reset;renderSetup();
</script></body></html>
